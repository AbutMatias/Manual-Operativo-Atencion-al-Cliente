name: Corregir imágenes locales

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir-imagenes:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Corregir referencias de imágenes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          DOC = Path("doc")
          IMG = DOC / "imagenes"

          print("==============================================")
          print("      CORRECCIÓN DE IMÁGENES LOCALES")
          print("==============================================")
          print()

          if not IMG.exists():
              print("ERROR: no existe la carpeta doc/imagenes")
              raise SystemExit(1)

          # ==================================================
          # CREAR LISTADO DE IMÁGENES LOCALES
          # ==================================================

          imagenes = {}

          for archivo in IMG.iterdir():

              if not archivo.is_file():
                  continue

              imagenes[archivo.stem] = archivo.name

          print("Imágenes locales encontradas:")
          print()

          for image_id, nombre in sorted(imagenes.items()):
              print(f"  {image_id} -> {nombre}")

          print()

          documentos_modificados = 0
          imagenes_encontradas = 0
          imagenes_faltantes = 0

          # ==================================================
          # PROCESAR TODOS LOS MARKDOWN
          # ==================================================

          for archivo in DOC.rglob("*.md"):

              texto = archivo.read_text(encoding="utf-8")

              original = texto

              # ==================================================
              # BUSCAR GITHUB USER ATTACHMENTS
              # ==================================================

              patron_github = re.compile(
                  r"https://github\.com/user-attachments/assets/([A-Za-z0-9-]+)"
              )

              ids_github = set(
                  patron_github.findall(texto)
              )

              # ==================================================
              # BUSCAR USER IMAGES
              # ==================================================

              patron_user_images = re.compile(
                  r"https://user-images\.githubusercontent\.com/[^/\s]+/([A-Za-z0-9-]+)\.([A-Za-z0-9]+)"
              )

              user_images = set(
                  patron_user_images.findall(texto)
              )

              if not ids_github and not user_images:
                  continue

              print("----------------------------------------------")
              print("Documento:")
              print(archivo)
              print("----------------------------------------------")

              # ==================================================
              # PROCESAR GITHUB ATTACHMENTS
              # ==================================================

              for image_id in sorted(ids_github):

                  url = (
                      "https://github.com/user-attachments/assets/"
                      + image_id
                  )

                  print()
                  print("GitHub Attachment:")
                  print(image_id)

                  imagen_local = None

                  # Buscar por ID exacto
                  for extension in [
                      ".png",
                      ".jpg",
                      ".jpeg",
                      ".gif",
                      ".webp",
                      ".svg",
                      ".PNG",
                      ".JPG",
                      ".JPEG",
                      ".GIF",
                      ".WEBP",
                      ".SVG",
                  ]:

                      candidato = IMG / f"{image_id}{extension}"

                      if candidato.exists():
                          imagen_local = candidato
                          break

                  if imagen_local is None:

                      print("  NO encontrada localmente")
                      print(f"  Esperada: {image_id}.*")

                      imagenes_faltantes += 1

                      continue

                  nombre = imagen_local.name
                  ruta = f"./imagenes/{nombre}"

                  print("  Encontrada:", nombre)

                  # ------------------------------------------
                  # [URL](URL)
                  # ------------------------------------------

                  texto = texto.replace(
                      f"[{url}]({url})",
                      ruta
                  )

                  # ------------------------------------------
                  # src="[URL](URL)"
                  # ------------------------------------------

                  texto = texto.replace(
                      f'src="[{url}]({url})"',
                      f'src="{ruta}"'
                  )

                  # ------------------------------------------
                  # URL directa
                  # ------------------------------------------

                  texto = texto.replace(
                      url,
                      ruta
                  )

                  imagenes_encontradas += 1

              # ==================================================
              # PROCESAR USER-IMAGES
              # ==================================================

              for image_id, extension in sorted(user_images):

                  url = None

                  # Buscar la URL completa en el documento
                  patron = re.compile(
                      r"https://user-images\.githubusercontent\.com/[^/\s]+/"
                      + re.escape(image_id)
                      + r"\."
                      + re.escape(extension)
                  )

                  encontrado = patron.search(texto)

                  if encontrado:
                      url = encontrado.group(0)

                  if not url:
                      continue

                  print()
                  print("User Images:")
                  print(url)

                  # ------------------------------------------------
                  # Buscar imagen local por ID
                  # ------------------------------------------------

                  imagen_local = None

                  for archivo_imagen in IMG.iterdir():

                      if not archivo_imagen.is_file():
                          continue

                      if archivo_imagen.stem == image_id:
                          imagen_local = archivo_imagen
                          break

                  if imagen_local is None:

                      print("  NO encontrada localmente")
                      print(f"  Esperada: {image_id}.*")

                      imagenes_faltantes += 1

                      continue

                  nombre = imagen_local.name
                  ruta = f"./imagenes/{nombre}"

                  print("  Encontrada:", nombre)

                  # ------------------------------------------
                  # [URL](URL)
                  # ------------------------------------------

                  texto = texto.replace(
                      f"[{url}]({url})",
                      ruta
                  )

                  # ------------------------------------------
                  # src="[URL](URL)"
                  # ------------------------------------------

                  texto = texto.replace(
                      f'src="[{url}]({url})"',
                      f'src="{ruta}"'
                  )

                  # ------------------------------------------
                  # URL directa
                  # ------------------------------------------

                  texto = texto.replace(
                      url,
                      ruta
                  )

                  imagenes_encontradas += 1

              # ==================================================
              # GUARDAR DOCUMENTO
              # ==================================================

              if texto != original:

                  archivo.write_text(
                      texto,
                      encoding="utf-8"
                  )

                  documentos_modificados += 1

                  print()
                  print("  DOCUMENTO MODIFICADO")

              else:

                  print()
                  print("  SIN CAMBIOS")

          # ==================================================
          # RESUMEN
          # ==================================================

          print()
          print("==============================================")
          print("                  RESUMEN")
          print("==============================================")
          print()
          print(
              "Documentos modificados:",
              documentos_modificados
          )
          print(
              "Imágenes asignadas:",
              imagenes_encontradas
          )
          print(
              "Imágenes faltantes:",
              imagenes_faltantes
          )
          print()

          PY

      - name: Verificar resultado
        shell: bash
        run: |
          echo "=============================================="
          echo "       VERIFICACIÓN DE IMÁGENES"
          echo "=============================================="
          echo ""

          echo "Imágenes locales:"
          find doc/imagenes -type f | sort

          echo ""

          echo "Referencias externas restantes:"
          grep -RniE \
            "github\.com/user-attachments/assets|user-images\.githubusercontent\.com" \
            doc \
            --include="*.md" \
            || true

          echo ""

          echo "Cambios:"
          git diff --stat

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc/

          if git diff --cached --quiet
          then
            echo "No hay cambios para guardar."
          else
            echo "Guardando cambios..."

            git commit -m "Convertir imágenes a referencias locales"

            git push
          fi
