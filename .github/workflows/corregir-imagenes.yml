name: Corregir imágenes locales

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir-imagenes:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Corregir referencias
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          DOC = Path("doc")
          IMG = DOC / "imagenes"

          print("==========================================")
          print(" CORREGIR IMÁGENES")
          print("==========================================")

          if not IMG.exists():
              print("ERROR: no existe doc/imagenes")
              exit(1)

          # ------------------------------------------
          # CREAR LISTA DE IMÁGENES
          # ------------------------------------------

          imagenes = {}

          for archivo in IMG.iterdir():

              if not archivo.is_file():
                  continue

              imagenes[archivo.stem] = archivo.name

          print()
          print("Imágenes encontradas:")
          
          for image_id, nombre in imagenes.items():
              print(f"  {image_id} -> {nombre}")

          print()

          # ------------------------------------------
          # PROCESAR MARKDOWN
          # ------------------------------------------

          modificados = 0

          for archivo in DOC.rglob("*.md"):

              texto = archivo.read_text(encoding="utf-8")

              original = texto

              # --------------------------------------
              # BUSCAR:
              #
              # https://github.com/user-attachments/assets/ID
              # --------------------------------------

              patron = re.compile(
                  r"https://github\.com/user-attachments/assets/([A-Za-z0-9-]+)"
              )

              ids = sorted(set(patron.findall(texto)))

              if not ids:
                  continue

              print("------------------------------------------")
              print("Documento:", archivo)

              for image_id in ids:

                  if image_id not in imagenes:

                      print("  Imagen NO encontrada:", image_id)

                      continue

                  nombre = imagenes[image_id]

                  ruta = "./imagenes/" + nombre

                  url = (
                      "https://github.com/user-attachments/assets/"
                      + image_id
                  )

                  print("  Imagen encontrada:", nombre)

                  # ==================================
                  # REEMPLAZAR:
                  #
                  # [URL](URL)
                  # ==================================

                  texto = texto.replace(
                      "[" + url + "](" + url + ")",
                      ruta
                  )

                  # ==================================
                  # REEMPLAZAR:
                  #
                  # src="[URL](URL)"
                  # ==================================

                  texto = texto.replace(
                      'src="[' + url + "](" + url + ')"',
                      'src="' + ruta + '"'
                  )

                  # ==================================
                  # REEMPLAZAR URL RESTANTE
                  # ==================================

                  texto = texto.replace(
                      url,
                      ruta
                  )

              # --------------------------------------
              # GUARDAR
              # --------------------------------------

              if texto != original:

                  archivo.write_text(
                      texto,
                      encoding="utf-8"
                  )

                  modificados += 1

                  print("  OK: documento modificado")

              else:

                  print("  SIN CAMBIOS")

          print()
          print("==========================================")
          print(" RESUMEN")
          print("==========================================")
          print()
          print("Documentos modificados:", modificados)

          PY

      - name: Comprobar resultado
        shell: bash
        run: |
          echo "=========================================="
          echo " COMPROBANDO URLs"
          echo "=========================================="

          echo ""

          grep -Rni \
            "github.com/user-attachments/assets" \
            doc \
            --include="*.md" \
            || true

          echo ""
          echo "=========================================="
          echo " GIT STATUS"
          echo "=========================================="

          git status

          echo ""
          echo "=========================================="
          echo " CAMBIOS"
          echo "=========================================="

          git diff -- doc/

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc/

          if git diff --cached --quiet
          then
            echo "NO HAY CAMBIOS"
          else
            echo "GUARDANDO CAMBIOS"

            git commit -m "Corregir referencias de imágenes"

            git push
          fi
