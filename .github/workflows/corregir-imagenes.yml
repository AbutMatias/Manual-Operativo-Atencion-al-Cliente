name: Corregir imágenes

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  corregir-imagenes:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Corregir imágenes de los documentos Markdown
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "   CORRECCIÓN DE IMÁGENES MARKDOWN"
          echo "=============================================="

          python3 <<'PY'
          from pathlib import Path
          import re

          DOC = Path("doc")
          IMAGENES = DOC / "imagenes"

          if not DOC.exists():
              print("ERROR: no existe la carpeta doc")
              raise SystemExit(1)

          if not IMAGENES.exists():
              print("ERROR: no existe doc/imagenes")
              raise SystemExit(1)

          extensiones = {
              ".jpg",
              ".jpeg",
              ".png",
              ".gif",
              ".webp",
              ".bmp"
          }

          archivos_imagenes = {}

          for imagen in IMAGENES.rglob("*"):

              if not imagen.is_file():
                  continue

              if imagen.suffix.lower() not in extensiones:
                  continue

              archivos_imagenes[imagen.name.lower()] = imagen
              archivos_imagenes[imagen.stem.lower()] = imagen

          print(
              f"Imágenes encontradas: {len(archivos_imagenes)}"
          )

          documentos = list(DOC.rglob("*.md"))

          print(
              f"Documentos encontrados: {len(documentos)}"
          )

          patron = re.compile(
              r'!\[([^\]]*)\]\(([^)]+)\)'
          )

          for archivo in documentos:

              print("----------------------------------------------")
              print(f"Documento: {archivo}")

              texto = archivo.read_text(
                  encoding="utf-8"
              )

              original = texto

              # Corregir Markdown escapado
              texto = texto.replace(r"\!", "!")
              texto = texto.replace(r"\(", "(")
              texto = texto.replace(r"\)", ")")

              def corregir_imagen(match):

                  alt = match.group(1)
                  ruta = match.group(2).strip()

                  # No modificar URLs externas
                  if (
                      ruta.startswith("http://")
                      or ruta.startswith("https://")
                      or ruta.startswith("data:")
                  ):
                      return match.group(0)

                  ruta = ruta.replace("\\", "")

                  while ruta.startswith("./"):
                      ruta = ruta[2:]

                  if ruta.startswith("doc/"):
                      ruta = ruta[4:]

                  nombre = Path(ruta).name

                  nombre_lower = nombre.lower()
                  stem = Path(nombre).stem.lower()

                  # ------------------------------------------
                  # ARCHIVO EXACTO
                  # ------------------------------------------

                  if nombre_lower in archivos_imagenes:

                      imagen = archivos_imagenes[nombre_lower]

                      print(
                          f"OK: {ruta} -> {imagen.name}"
                      )

                      return (
                          f"![{alt}]"
                          f"(./imagenes/{imagen.name})"
                      )

                  # ------------------------------------------
                  # MISMO NOMBRE SIN EXTENSIÓN
                  # ------------------------------------------

                  if stem in archivos_imagenes:

                      imagen = archivos_imagenes[stem]

                      print(
                          f"OK: {ruta} -> {imagen.name}"
                      )

                      return (
                          f"![{alt}]"
                          f"(./imagenes/{imagen.name})"
                      )

                  # ------------------------------------------
                  # BUSCAR COINCIDENCIA PARCIAL
                  # ------------------------------------------

                  coincidencias = []

                  for clave, imagen in archivos_imagenes.items():

                      if (
                          clave == stem
                          or clave.endswith(stem)
                          or stem.endswith(clave)
                      ):
                          coincidencias.append(imagen)

                  if coincidencias:

                      imagen = coincidencias[0]

                      print(
                          f"CORREGIDA: {ruta} -> {imagen.name}"
                      )

                      return (
                          f"![{alt}]"
                          f"(./imagenes/{imagen.name})"
                      )

                  # ------------------------------------------
                  # SI NO TIENE EXTENSIÓN, PROBAR .JPG
                  # ------------------------------------------

                  if "." not in nombre:

                      candidato = (
                          stem + ".jpg"
                      ).lower()

                      if candidato in archivos_imagenes:

                          imagen = archivos_imagenes[
                              candidato
                          ]

                          print(
                              f"CORREGIDA: {ruta} -> {imagen.name}"
                          )

                          return (
                              f"![{alt}]"
                              f"(./imagenes/{imagen.name})"
                          )

                  print(
                      f"AVISO: imagen no encontrada: {ruta}"
                  )

                  return match.group(0)

              texto = patron.sub(
                  corregir_imagen,
                  texto
              )

              if texto != original:

                  archivo.write_text(
                      texto,
                      encoding="utf-8"
                  )

                  print(
                      f"ACTUALIZADO: {archivo}"
                  )

              else:

                  print(
                      "Sin cambios"
                  )

          print("")
          print("==============================================")
          print("CORRECCIÓN FINALIZADA")
          print("==============================================")
          PY

      - name: Guardar cambios en GitHub
        shell: bash
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc

          if git diff --cached --quiet; then

            echo "No hay cambios para guardar."

          else

            git commit -m "Corregir referencias de imágenes"

            git push origin main

          fi
