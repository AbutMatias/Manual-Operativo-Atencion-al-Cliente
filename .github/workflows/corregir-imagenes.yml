name: Correcciones automáticas

on:
  push:
    branches:
      - main

jobs:
  corregir:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Corregir imágenes de los documentos Markdown
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "   CORRECCIÓN DE IMÁGENES MARKDOWN"
          echo "=============================================="

          python3 <<'PY'
          from pathlib import Path
          import re

          DOC = Path("doc")
          IMAGENES = DOC / "imagenes"

          if not DOC.exists():
              print("ERROR: no existe la carpeta doc")
              raise SystemExit(1)

          if not IMAGENES.exists():
              print("ERROR: no existe doc/imagenes")
              raise SystemExit(1)

          extensiones = {
              ".jpg",
              ".jpeg",
              ".png",
              ".gif",
              ".webp",
              ".bmp"
          }

          imagenes = []

          for archivo in IMAGENES.rglob("*"):

              if not archivo.is_file():
                  continue

              if archivo.suffix.lower() not in extensiones:
                  continue

              imagenes.append(archivo)

          print(f"Imágenes encontradas: {len(imagenes)}")

          indice = {}

          for imagen in imagenes:

              indice[imagen.name.lower()] = imagen

              stem = imagen.stem.lower()

              if stem not in indice:
                  indice[stem] = imagen

          documentos = list(DOC.rglob("*.md"))

          print(f"Documentos encontrados: {len(documentos)}")

          for documento in documentos:

              print("")
              print("==============================================")
              print(f"Documento: {documento}")
              print("==============================================")

              texto = documento.read_text(
                  encoding="utf-8"
              )

              original = texto

              # ------------------------------------------
              # CORREGIR MARKDOWN ESCAPADO
              # ------------------------------------------

              texto = texto.replace(r"\#", "#")
              texto = texto.replace(r"\!", "!")
              texto = texto.replace(r"\(", "(")
              texto = texto.replace(r"\)", ")")
              texto = texto.replace(r"\_", "_")

              # ------------------------------------------
              # CORREGIR IMÁGENES ESCAPADAS
              # ------------------------------------------

              texto = re.sub(
                  r'!\[([^\]]*)\]\\\((.*?)\\\)',
                  r'![\1](\2)',
                  texto
              )

              # ------------------------------------------
              # BUSCAR IMÁGENES
              # ------------------------------------------

              patron = re.compile(
                  r'!\[([^\]]*)\]\(([^)\n]+)\)'
              )

              def corregir(match):

                  alt = match.group(1)
                  ruta = match.group(2).strip()

                  # URL externa
                  if (
                      ruta.startswith("http://")
                      or ruta.startswith("https://")
                      or ruta.startswith("data:")
                  ):
                      return match.group(0)

                  ruta = ruta.replace("\\", "/")

                  while ruta.startswith("./"):
                      ruta = ruta[2:]

                  while ruta.startswith("/"):
                      ruta = ruta[1:]

                  nombre = Path(ruta).name
                  nombre_lower = nombre.lower()

                  # --------------------------------------
                  # COINCIDENCIA EXACTA
                  # --------------------------------------

                  if nombre_lower in indice:

                      imagen = indice[nombre_lower]

                      nueva = (
                          "./imagenes/"
                          + imagen.name
                      )

                      print(
                          f"OK: {ruta} -> {nueva}"
                      )

                      return (
                          f"![{alt}]({nueva})"
                      )

                  # --------------------------------------
                  # BUSCAR POR STEM
                  # --------------------------------------

                  stem = Path(nombre).stem.lower()

                  candidatos = []

                  for imagen in imagenes:

                      imagen_stem = (
                          imagen.stem.lower()
                      )

                      if (
                          imagen_stem == stem
                          or imagen_stem.endswith(stem)
                          or stem.endswith(imagen_stem)
                      ):
                          candidatos.append(imagen)

                  # --------------------------------------
                  # ENCONTRADO
                  # --------------------------------------

                  if candidatos:

                      # Preferir JPG
                      candidatos.sort(
                          key=lambda x: (
                              0
                              if x.suffix.lower() == ".jpg"
                              else 1
                          )
                      )

                      imagen = candidatos[0]

                      nueva = (
                          "./imagenes/"
                          + imagen.name
                      )

                      print(
                          f"CORREGIDA:"
                      )

                      print(
                          f"  Antes: {ruta}"
                      )

                      print(
                          f"  Ahora: {nueva}"
                      )

                      return (
                          f"![{alt}]({nueva})"
                      )

                  # --------------------------------------
                  # NO ENCONTRADA
                  # --------------------------------------

                  print(
                      f"AVISO: no encontrada: {ruta}"
                  )

                  return match.group(0)

              texto = patron.sub(
                  corregir,
                  texto
              )

              # ------------------------------------------
              # GUARDAR
              # ------------------------------------------

              if texto != original:

                  documento.write_text(
                      texto,
                      encoding="utf-8"
                  )

                  print(
                      f"OK: actualizado {documento}"
                  )

              else:

                  print("Sin cambios")

          print("")
          print("==============================================")
          print("CORRECCIÓN FINALIZADA")
          print("==============================================")
          PY

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Corregir referencias de imágenes"
            git push
          fi
