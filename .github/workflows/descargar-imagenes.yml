name: Descargar imágenes de documentación

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar-imagenes:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # DESCARGAR REPOSITORIO
      # =========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # =========================================================
      # INSTALAR HERRAMIENTAS
      # =========================================================

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y wget file


      # =========================================================
      # PROCESAR IMÁGENES
      # =========================================================

      - name: Procesar imágenes
        shell: bash
        run: |

          mkdir -p doc/imagenes

          echo ""
          echo "======================================"
          echo " BUSCANDO IMÁGENES"
          echo "======================================"
          echo ""

          find doc -type f -name "*.md" -print0 | while IFS= read -r -d '' archivo
          do

            echo ""
            echo "--------------------------------------"
            echo "Documento: $archivo"
            echo "--------------------------------------"

            # =================================================
            # BUSCAR IMÁGENES
            # =================================================

            imagenes=$(grep -oE 'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' "$archivo" || true)

            # Si el documento no tiene imágenes,
            # simplemente continuamos con el siguiente.

            if [ -z "$imagenes" ]; then

              echo "No contiene imágenes."
              continue

            fi


            # =================================================
            # PROCESAR CADA IMAGEN
            # =================================================

            echo "$imagenes" |
            sort -u |
            while read -r url
            do

              if [ -z "$url" ]; then
                continue
              fi


              # -----------------------------------------------
              # ID DE LA IMAGEN
              # -----------------------------------------------

              id=$(basename "$url")


              temporal="doc/imagenes/$id"


              echo ""
              echo "Imagen encontrada:"
              echo "$url"


              # =================================================
              # VERIFICAR SI YA EXISTE
              # =================================================

              existente=$(find doc/imagenes -type f -name "$id.*" | head -n 1 || true)


              if [ -n "$existente" ]; then

                echo "La imagen ya existe:"
                echo "$existente"

                nombre=$(basename "$existente")

                sed -i \
                  "s|$url|./imagenes/$nombre|g" \
                  "$archivo"

                continue

              fi


              # =================================================
              # DESCARGAR
              # =================================================

              echo "Descargando..."


              if wget \
                --quiet \
                --timeout=30 \
                --tries=3 \
                "$url" \
                -O "$temporal"
              then

                tipo=$(file --brief --mime-type "$temporal")


                echo "Tipo detectado: $tipo"


                # =================================================
                # DETERMINAR EXTENSIÓN
                # =================================================

                case "$tipo" in

                  image/jpeg)

                    nuevo="$temporal.jpg"

                    mv "$temporal" "$nuevo"

                    ;;


                  image/png)

                    nuevo="$temporal.png"

                    mv "$temporal" "$nuevo"

                    ;;


                  image/gif)

                    nuevo="$temporal.gif"

                    mv "$temporal" "$nuevo"

                    ;;


                  image/webp)

                    nuevo="$temporal.webp"

                    mv "$temporal" "$nuevo"

                    ;;


                  image/svg+xml)

                    nuevo="$temporal.svg"

                    mv "$temporal" "$nuevo"

                    ;;


                  *)

                    echo "Formato no compatible: $tipo"

                    rm -f "$temporal"

                    continue

                    ;;

                esac


                # =================================================
                # NOMBRE FINAL
                # =================================================

                nombre=$(basename "$nuevo")


                echo "Imagen guardada:"
                echo "doc/imagenes/$nombre"


                # =================================================
                # REEMPLAZAR URL EN MARKDOWN
                # =================================================

                sed -i \
                  "s|$url|./imagenes/$nombre|g" \
                  "$archivo"


              else

                echo ""
                echo "ERROR: No se pudo descargar:"
                echo "$url"
                echo ""

                rm -f "$temporal"

              fi

            done

          done


      # =========================================================
      # MOSTRAR CAMBIOS
      # =========================================================

      - name: Mostrar cambios
        run: |

          echo ""
          echo "======================================"
          echo " CAMBIOS DETECTADOS"
          echo "======================================"
          echo ""

          git status

          echo ""
          echo "Resumen:"
          echo ""

          git diff --stat || true


      # =========================================================
      # GUARDAR CAMBIOS
      # =========================================================

      - name: Guardar cambios
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add doc/


          if git diff --cached --quiet
          then

            echo ""
            echo "No hay cambios para guardar."
            echo ""

          else

            echo ""
            echo "Guardando cambios..."
            echo ""

            git commit \
              -m "Descargar imágenes de documentación"

            git push

          fi
