name: Asignar imágenes locales

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  asignar-imagenes:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # DESCARGAR REPOSITORIO
      # =====================================================

      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # =====================================================
      # PROCESAR DOCUMENTOS
      # =====================================================

      - name: Asignar imágenes
        shell: bash
        run: |

          echo "=============================================="
          echo "      ASIGNACIÓN DE IMÁGENES LOCALES"
          echo "=============================================="
          echo ""

          mkdir -p doc/imagenes


          # =================================================
          # RECORRER TODOS LOS MARKDOWN
          # =================================================

          find doc -type f -name "*.md" -print0 |
          while IFS= read -r -d '' archivo
          do

            echo ""
            echo "Documento:"
            echo "$archivo"


            # =================================================
            # BUSCAR IDs DE USER-ATTACHMENTS
            # =================================================

            grep -oE \
              'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' \
              "$archivo" 2>/dev/null |
            sort -u |
            while IFS= read -r url
            do

              if [ -z "$url" ]; then
                continue
              fi


              # =================================================
              # OBTENER ID
              # =================================================

              id="${url##*/}"


              echo ""
              echo "Imagen detectada:"
              echo "$id"


              # =================================================
              # BUSCAR ARCHIVO LOCAL
              # =================================================

              imagen=""


              for extension in png jpg jpeg gif webp svg PNG JPG JPEG GIF WEBP SVG
              do

                archivo_imagen="doc/imagenes/${id}.${extension}"

                if [ -f "$archivo_imagen" ]; then

                  imagen="$archivo_imagen"

                  break

                fi

              done


              # =================================================
              # SI EXISTE LA IMAGEN
              # =================================================

              if [ -n "$imagen" ]; then

                nombre=$(basename "$imagen")

                echo "Encontrada:"
                echo "$nombre"


                # =================================================
                # REEMPLAZAR TODAS LAS VARIANTES
                # =================================================

                sed -i \
                  "s|$url|./imagenes/$nombre|g" \
                  "$archivo"


                # =================================================
                # ELIMINAR FORMATO MARKDOWN
                #
                # [URL](URL)
                # =================================================

                sed -i \
                  "s|\[\.\/imagenes\/$nombre\](\.\/imagenes\/$nombre)|./imagenes/$nombre|g" \
                  "$archivo"


                echo "Referencia corregida."


              else

                echo "NO encontrada localmente:"
                echo "doc/imagenes/${id}.*"

              fi

            done

          done


      # =====================================================
      # MOSTRAR RESULTADO
      # =====================================================

      - name: Mostrar resultado
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo "           IMÁGENES LOCALES"
          echo "=============================================="
          echo ""

          find doc/imagenes \
            -type f \
            -print |
            sort

          echo ""

          echo "=============================================="
          echo "           CAMBIOS REALIZADOS"
          echo "=============================================="
          echo ""

          git diff --stat

          echo ""


      # =====================================================
      # MOSTRAR DOCUMENTOS CON REFERENCIAS EXTERNAS
      # =====================================================

      - name: Verificar referencias pendientes
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo "       REFERENCIAS PENDIENTES"
          echo "=============================================="
          echo ""


          pendientes=$(
            grep -RhoE \
              'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' \
              doc \
              --include="*.md" \
              2>/dev/null |
            sort -u
          )


          if [ -z "$pendientes" ]; then

            echo "OK."
            echo "No quedan URLs externas."

          else

            echo "Todavía quedan:"
            echo ""

            echo "$pendientes"

          fi


      # =====================================================
      # GUARDAR CAMBIOS
      # =====================================================

      - name: Guardar cambios
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo "             GUARDANDO CAMBIOS"
          echo "=============================================="
          echo ""


          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add doc/


          if git diff --cached --quiet
          then

            echo "No hay cambios."

          else

            git commit \
              -m "Asignar imágenes locales"

            git push

            echo ""
            echo "Cambios guardados correctamente."

          fi
