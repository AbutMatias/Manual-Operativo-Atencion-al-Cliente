name: Descargar imágenes de documentación

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar-imagenes:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y wget file

      - name: Procesar imágenes
        shell: bash
        run: |
          mkdir -p doc/imagenes

          echo "======================================"
          echo " BUSCANDO IMAGENES"
          echo "======================================"

          find doc -type f -name "*.md" -print0 | while IFS= read -r -d '' archivo
          do
            echo ""
            echo "Documento: $archivo"

            grep -oE 'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' "$archivo" 2>/dev/null | sort -u > /tmp/imagenes.txt || true

            while IFS= read -r url
            do
              [ -z "$url" ] && continue

              id=$(basename "$url")

              echo ""
              echo "Imagen encontrada:"
              echo "$url"

              existente=$(find doc/imagenes -type f -name "${id}.*" | head -n 1 || true)

              if [ -n "$existente" ]; then
                echo "La imagen ya existe: $existente"

                nombre=$(basename "$existente")

                sed -i "s|$url|./imagenes/$nombre|g" "$archivo"

                continue
              fi

              temporal="doc/imagenes/${id}.download"

              echo "Descargando..."

              wget \
                --quiet \
                --timeout=30 \
                --tries=3 \
                --user-agent="Mozilla/5.0" \
                "$url" \
                -O "$temporal"

              if [ $? -ne 0 ]; then
                echo "ERROR: No se pudo descargar:"
                echo "$url"

                rm -f "$temporal"

                continue
              fi

              tipo=$(file --brief --mime-type "$temporal" 2>/dev/null || echo "unknown")

              echo "Tipo detectado: $tipo"

              case "$tipo" in

                image/jpeg)
                  extension="jpg"
                  ;;

                image/png)
                  extension="png"
                  ;;

                image/gif)
                  extension="gif"
                  ;;

                image/webp)
                  extension="webp"
                  ;;

                image/svg+xml)
                  extension="svg"
                  ;;

                *)
                  echo "Formato no compatible: $tipo"

                  rm -f "$temporal"

                  continue
                  ;;

              esac

              nuevo="doc/imagenes/${id}.${extension}"

              mv "$temporal" "$nuevo"

              nombre=$(basename "$nuevo")

              echo ""
              echo "Imagen guardada:"
              echo "$nuevo"

              sed -i "s|$url|./imagenes/$nombre|g" "$archivo"

              echo "Referencia actualizada."

            done < /tmp/imagenes.txt

          done

      - name: Verificar imágenes
        run: |
          echo "======================================"
          echo " IMAGENES DESCARGADAS"
          echo "======================================"

          find doc/imagenes -type f -print | sort

          cantidad=$(find doc/imagenes -type f | wc -l)

          echo ""
          echo "Total de imagenes: $cantidad"

      - name: Verificar URLs pendientes
        run: |
          echo "======================================"
          echo " VERIFICANDO URLS EXTERNAS"
          echo "======================================"

          pendientes=$(grep -RhoE 'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' doc --include="*.md" 2>/dev/null | sort -u || true)

          if [ -z "$pendientes" ]; then
            echo "OK: No quedan imagenes externas."
          else
            echo "ADVERTENCIA:"
            echo ""
            echo "$pendientes"
          fi

      - name: Mostrar cambios
        run: |
          echo "======================================"
          echo " CAMBIOS DETECTADOS"
          echo "======================================"

          git status

          echo ""
          echo "Resumen:"
          git diff --stat || true

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc/

          if git diff --cached --quiet
          then
            echo "No hay cambios para guardar."
          else
            echo "Guardando cambios..."

            git commit -m "Descargar y corregir imagenes de documentacion"

            git push
          fi
