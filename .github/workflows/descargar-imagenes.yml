name: Descargar imágenes de documentación

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar-imagenes:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y wget file

      - name: Procesar imágenes
        shell: bash
        run: |

          mkdir -p doc/imagenes

          echo "======================================"
          echo " BUSCANDO IMÁGENES"
          echo "======================================"

          find doc -type f -name "*.md" -print0 | while IFS= read -r -d '' archivo
          do

            echo ""
            echo "--------------------------------------"
            echo "Documento: $archivo"
            echo "--------------------------------------"

            grep -oE 'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' "$archivo" |
            sort -u |
            while read -r url
            do

              if [ -z "$url" ]; then
                continue
              fi

              id=$(basename "$url")

              temporal="doc/imagenes/$id"

              echo ""
              echo "Imagen encontrada:"
              echo "$url"

              # Buscar si ya existe
              existente=$(find doc/imagenes -type f -name "$id.*" | head -n 1)

              if [ -n "$existente" ]; then

                echo "La imagen ya existe:"
                echo "$existente"

                nombre=$(basename "$existente")

                sed -i "s|$url|./imagenes/$nombre|g" "$archivo"

                continue

              fi

              echo "Descargando..."

              if wget \
                --quiet \
                --timeout=30 \
                --tries=3 \
                "$url" \
                -O "$temporal"
              then

                tipo=$(file --brief --mime-type "$temporal")

                echo "Tipo detectado: $tipo"

                case "$tipo" in

                  image/jpeg)

                    nuevo="$temporal.jpg"
                    mv "$temporal" "$nuevo"

                    ;;

                  image/png)

                    nuevo="$temporal.png"
                    mv "$temporal" "$nuevo"

                    ;;

                  image/gif)

                    nuevo="$temporal.gif"
                    mv "$temporal" "$nuevo"

                    ;;

                  image/webp)

                    nuevo="$temporal.webp"
                    mv "$temporal" "$nuevo"

                    ;;

                  image/svg+xml)

                    nuevo="$temporal.svg"
                    mv "$temporal" "$nuevo"

                    ;;

                  *)

                    echo "Formato no compatible: $tipo"

                    rm -f "$temporal"

                    continue

                    ;;

                esac

                nombre=$(basename "$nuevo")

                echo "Imagen guardada:"
                echo "doc/imagenes/$nombre"

                # Reemplazar URL original por ruta local
                sed -i \
                  "s|$url|./imagenes/$nombre|g" \
                  "$archivo"

              else

                echo "ERROR: No se pudo descargar:"
                echo "$url"

                rm -f "$temporal"

              fi

            done

          done

      - name: Mostrar cambios
        run: |

          echo ""
          echo "======================================"
          echo " CAMBIOS DETECTADOS"
          echo "======================================"

          git status

          echo ""
          git diff --stat

      - name: Guardar cambios
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc/

          if git diff --cached --quiet
          then

            echo "No hay cambios para guardar."

          else

            git commit \
              -m "Descargar imágenes de documentación"

            git push

          fi
