
name: Descargar imágenes de documentación

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write


jobs:

  descargar-imagenes:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # DESCARGAR REPOSITORIO
      # =========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # =========================================================
      # INSTALAR HERRAMIENTAS
      # =========================================================

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y curl file


      # =========================================================
      # PROCESAR IMÁGENES
      # =========================================================

      - name: Descargar y reemplazar imágenes
        shell: bash
        run: |

          set -u

          mkdir -p doc/imagenes


          echo ""
          echo "=============================================="
          echo " DESCARGA DE IMÁGENES"
          echo "=============================================="
          echo ""


          # =====================================================
          # RECORRER TODOS LOS ARCHIVOS MARKDOWN
          # =====================================================

          find doc \
            -type f \
            -name "*.md" \
            -print0 |
          while IFS= read -r -d '' archivo
          do

            echo ""
            echo "----------------------------------------------"
            echo "Documento: $archivo"
            echo "----------------------------------------------"


            # =================================================
            # BUSCAR URLS DE USER-ATTACHMENTS
            # =================================================

            imagenes=$(grep -oE \
              'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' \
              "$archivo" \
              2>/dev/null ||
              true)


            # =================================================
            # SI NO HAY IMÁGENES
            # =================================================

            if [ -z "$imagenes" ]; then

              echo "No contiene imágenes."

              continue

            fi


            # =================================================
            # ELIMINAR DUPLICADOS
            # =================================================

            imagenes=$(printf '%s\n' "$imagenes" | sort -u)


            # =================================================
            # PROCESAR CADA IMAGEN
            # =================================================

            while IFS= read -r url
            do

              if [ -z "$url" ]; then
                continue
              fi


              # =================================================
              # OBTENER ID
              # =================================================

              id=$(basename "$url")


              echo ""
              echo "Imagen encontrada:"
              echo "$url"


              # =================================================
              # BUSCAR IMAGEN EXISTENTE
              # =================================================

              existente=$(find doc/imagenes \
                -type f \
                -name "${id}.*" \
                2>/dev/null |
                head -n 1 ||
                true)


              # =================================================
              # SI YA EXISTE
              # =================================================

              if [ -n "$existente" ]; then

                echo "La imagen ya existe:"
                echo "$existente"


                nombre=$(basename "$existente")


                # ---------------------------------------------
                # REEMPLAZAR URL
                # ---------------------------------------------

                sed -i \
                  "s|$url|./imagenes/$nombre|g" \
                  "$archivo"


                echo "Referencia actualizada."

                continue

              fi


              # =================================================
              # ARCHIVO TEMPORAL
              # =================================================

              temporal="doc/imagenes/${id}.download"


              rm -f "$temporal"


              echo ""
              echo "Descargando..."


              # =================================================
              # DESCARGAR IMAGEN
              # =================================================

              if curl \
                -L \
                --fail \
                --silent \
                --show-error \
                --retry 3 \
                --retry-delay 2 \
                --connect-timeout 30 \
                --max-time 120 \
                -A "Mozilla/5.0" \
                "$url" \
                -o "$temporal"
              then

                echo "Descarga correcta."


                # =============================================
                # VERIFICAR QUE EL ARCHIVO NO ESTÉ VACÍO
                # =============================================

                if [ ! -s "$temporal" ]; then

                  echo "ERROR: La imagen descargada está vacía."

                  rm -f "$temporal"

                  continue

                fi


                # =============================================
                # DETECTAR TIPO
                # =============================================

                tipo=$(file \
                  --brief \
                  --mime-type \
                  "$temporal" \
                  2>/dev/null ||
                  echo "unknown")


                echo "Tipo detectado: $tipo"


                # =============================================
                # DETERMINAR EXTENSIÓN
                # =============================================

                case "$tipo" in

                  image/jpeg)
                    extension="jpg"
                    ;;

                  image/png)
                    extension="png"
                    ;;

                  image/gif)
                    extension="gif"
                    ;;

                  image/webp)
                    extension="webp"
                    ;;

                  image/svg+xml)
                    extension="svg"
                    ;;

                  *)
                    echo ""
                    echo "ERROR: Formato no compatible."
                    echo "Tipo detectado: $tipo"
                    echo "URL: $url"
                    echo ""

                    rm -f "$temporal"

                    continue
                    ;;

                esac


                # =============================================
                # NOMBRE FINAL
                # =============================================

                nuevo="doc/imagenes/${id}.${extension}"


                # =============================================
                # MOVER IMAGEN
                # =============================================

                mv "$temporal" "$nuevo"


                nombre=$(basename "$nuevo")


                echo ""
                echo "Imagen guardada:"
                echo "$nuevo"


                # =============================================
                # REEMPLAZAR URL EN MARKDOWN
                # =============================================

                sed -i \
                  "s|$url|./imagenes/$nombre|g" \
                  "$archivo"


                echo ""
                echo "Referencia actualizada."
                echo ""


              else

                echo ""
                echo "=============================================="
                echo " ERROR AL DESCARGAR IMAGEN"
                echo "=============================================="
                echo ""
                echo "Documento:"
                echo "$archivo"
                echo ""
                echo "URL:"
                echo "$url"
                echo ""
                echo "La ejecución continuará con la siguiente imagen."
                echo ""


                rm -f "$temporal"

              fi


            done <<< "$imagenes"


          done


      # =========================================================
      # VERIFICAR IMÁGENES
      # =========================================================

      - name: Verificar imágenes
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo " IMÁGENES DESCARGADAS"
          echo "=============================================="
          echo ""


          if [ -d "doc/imagenes" ]; then

            find doc/imagenes \
              -type f \
              -print |
              sort

          else

            echo "No existe la carpeta doc/imagenes."

          fi


          cantidad=$(find doc/imagenes \
            -type f \
            2>/dev/null |
            wc -l)


          echo ""
          echo "=============================================="
          echo " TOTAL DE IMÁGENES: $cantidad"
          echo "=============================================="
          echo ""


      # =========================================================
      # VERIFICAR URLs EXTERNAS
      # =========================================================

      - name: Verificar URLs pendientes
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo " VERIFICANDO URLs EXTERNAS"
          echo "=============================================="
          echo ""


          pendientes=$(grep -RhoE \
            'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' \
            doc \
            --include="*.md" \
            2>/dev/null |
            sort -u ||
            true)


          if [ -z "$pendientes" ]; then

            echo ""
            echo "OK."
            echo "No quedan imágenes externas."
            echo ""

          else

            echo ""
            echo "ADVERTENCIA."
            echo ""
            echo "Todavía quedan estas URLs:"
            echo ""
            echo "$pendientes"
            echo ""

          fi


      # =========================================================
      # MOSTRAR CAMBIOS
      # =========================================================

      - name: Mostrar cambios
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo " CAMBIOS DETECTADOS"
          echo "=============================================="
          echo ""


          git status


          echo ""
          echo "=============================================="
          echo " RESUMEN"
          echo "=============================================="
          echo ""


          git diff --stat || true


      # =========================================================
      # GUARDAR CAMBIOS
      # =========================================================

      - name: Guardar cambios
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo " GUARDANDO CAMBIOS"
          echo "=============================================="
          echo ""


          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add doc/


          # =====================================================
          # VERIFICAR SI HAY CAMBIOS
          # =====================================================

          if git diff --cached --quiet
          then

            echo ""
            echo "No hay cambios para guardar."
            echo ""

          else

            echo ""
            echo "Cambios encontrados."
            echo ""


            git diff --cached --stat


            echo ""
            echo "Creando commit..."
            echo ""


            git commit \
              -m "Descargar y corregir imágenes de documentación"


            echo ""
            echo "Enviando cambios a GitHub..."
            echo ""


            git push


            echo ""
            echo "=============================================="
            echo " PROCESO COMPLETADO"
            echo "=============================================="
            echo ""

          fi

