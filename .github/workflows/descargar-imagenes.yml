name: Asignar imágenes locales

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  asignar-imagenes:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Procesar imágenes
        shell: bash
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          DOCS = Path("doc")
          IMAGENES = DOCS / "imagenes"

          IMAGENES.mkdir(parents=True, exist_ok=True)

          extensiones = [
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".webp",
              ".svg",
              ".PNG",
              ".JPG",
              ".JPEG",
              ".GIF",
              ".WEBP",
              ".SVG",
          ]

          patron = re.compile(
              r"https://github\.com/user-attachments/assets/([a-zA-Z0-9-]+)"
          )

          documentos = list(DOCS.rglob("*.md"))

          encontrados = 0
          corregidos = 0
          pendientes = 0

          print("==============================================")
          print("      ASIGNACIÓN DE IMÁGENES LOCALES")
          print("==============================================")
          print()

          for archivo in documentos:

              print("----------------------------------------------")
              print(f"Documento: {archivo}")
              print("----------------------------------------------")

              try:
                  texto = archivo.read_text(encoding="utf-8")
              except Exception as e:
                  print(f"ERROR leyendo documento: {e}")
                  continue

              urls = sorted(set(patron.findall(texto)))

              if not urls:
                  print("Sin imágenes externas.")
                  print()
                  continue

              for image_id in urls:

                  encontrados += 1

                  print()
                  print(f"Imagen encontrada: {image_id}")

                  imagen_local = None

                  for extension in extensiones:

                      candidato = IMAGENES / f"{image_id}{extension}"

                      if candidato.exists():
                          imagen_local = candidato
                          break

                  if imagen_local is None:

                      print("NO encontrada localmente.")
                      print(f"Esperada: doc/imagenes/{image_id}.*")

                      pendientes += 1

                      continue

                  nombre = imagen_local.name

                  print(f"Imagen local: {nombre}")

                  ruta = f"./imagenes/{nombre}"

                  # -------------------------------------------------
                  # CASO 1
                  # <img src="URL">
                  # -------------------------------------------------

                  texto_nuevo = re.sub(
                      rf'src="\[?{re.escape("https://github.com/user-attachments/assets/" + image_id)}\]?'
                      rf'(?:\({re.escape("https://github.com/user-attachments/assets/" + image_id)}\))?"',
                      f'src="{ruta}"',
                      texto
                  )

                  # -------------------------------------------------
                  # CASO 2
                  # [URL](URL)
                  # -------------------------------------------------

                  url_completa = (
                      "https://github.com/user-attachments/assets/"
                      + image_id
                  )

                  texto_nuevo = texto_nuevo.replace(
                      f"[{url_completa}]({url_completa})",
                      ruta
                  )

                  # -------------------------------------------------
                  # CASO 3
                  # URL directa
                  # -------------------------------------------------

                  texto_nuevo = texto_nuevo.replace(
                      url_completa,
                      ruta
                  )

                  if texto_nuevo != texto:

                      texto = texto_nuevo
                      corregidos += 1

                      print("Referencia corregida.")

              try:
                  archivo.write_text(
                      texto,
                      encoding="utf-8"
                  )
              except Exception as e:
                  print(f"ERROR guardando documento: {e}")

              print()

          print("==============================================")
          print("                 RESUMEN")
          print("==============================================")
          print()
          print(f"URLs encontradas: {encontrados}")
          print(f"Documentos corregidos: {corregidos}")
          print(f"Imágenes pendientes: {pendientes}")
          print()

          print("==============================================")
          print("             IMÁGENES LOCALES")
          print("==============================================")
          print()

          for imagen in sorted(IMAGENES.iterdir()):
              if imagen.is_file():
                  print(imagen)

          PY


      - name: Mostrar cambios
        shell: bash
        run: |
          echo "=============================================="
          echo "              CAMBIOS"
          echo "=============================================="
          echo ""

          git status

          echo ""
          git diff --stat || true


      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc/

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Asignar imágenes locales a documentación"
            git push
          fi
