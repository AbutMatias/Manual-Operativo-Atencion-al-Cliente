name: Descargar imágenes de documentación

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar-imagenes:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # DESCARGAR REPOSITORIO
      # =========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # =========================================================
      # INSTALAR HERRAMIENTAS
      # =========================================================

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y wget file


      # =========================================================
      # PROCESAR IMÁGENES
      # =========================================================

      - name: Procesar imágenes
        shell: bash
        run: |

          set -u

          mkdir -p doc/imagenes

          echo ""
          echo "======================================"
          echo " BUSCANDO IMÁGENES"
          echo "======================================"
          echo ""


          # =====================================================
          # RECORRER TODOS LOS MARKDOWN
          # =====================================================

          while IFS= read -r -d '' archivo
          do

            echo ""
            echo "--------------------------------------"
            echo "Documento: $archivo"
            echo "--------------------------------------"


            # ===================================================
            # EXTRAER URLS DE USER-ATTACHMENTS
            # ===================================================

            imagenes=$(
              grep -oE \
              'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' \
              "$archivo" \
              2>/dev/null \
              | sort -u \
              || true
            )


            if [ -z "$imagenes" ]; then

              echo "No contiene imágenes externas."

              continue

            fi


            # ===================================================
            # PROCESAR CADA IMAGEN
            # ===================================================

            while IFS= read -r url
            do

              if [ -z "$url" ]; then
                continue
              fi


              id=$(basename "$url")


              echo ""
              echo "Imagen encontrada:"
              echo "$url"


              # =================================================
              # BUSCAR SI YA EXISTE
              # =================================================

              existente=$(
                find doc/imagenes \
                  -type f \
                  -name "${id}.*" \
                  2>/dev/null \
                  | head -n 1 \
                  || true
              )


              if [ -n "$existente" ]; then

                echo "La imagen ya existe:"
                echo "$existente"


                nombre=$(basename "$existente")


                # ---------------------------------------------
                # REEMPLAZAR URL
                # ---------------------------------------------

                python3 - "$archivo" "$url" "$nombre" <<'PY'
import sys
from pathlib import Path

archivo = Path(sys.argv[1])
url = sys.argv[2]
nombre = sys.argv[3]

texto = archivo.read_text(encoding="utf-8")

texto = texto.replace(
    url,
    f"./imagenes/{nombre}"
)

archivo.write_text(
    texto,
    encoding="utf-8"
)
PY


                continue

              fi


              # =================================================
              # DESCARGAR
              # =================================================

              temporal="doc/imagenes/$id.download"


              echo "Descargando..."


              if wget \
                --quiet \
                --timeout=30 \
                --tries=3 \
                --user-agent="Mozilla/5.0" \
                "$url" \
                -O "$temporal"
              then


                # ===============================================
                # DETECTAR TIPO
                # ===============================================

                tipo=$(
                  file \
                    --brief \
                    --mime-type \
                    "$temporal" \
                    2>/dev/null \
                    || echo "unknown"
                )


                echo "Tipo detectado: $tipo"


                # ===============================================
                # DETERMINAR EXTENSIÓN
                # ===============================================

                case "$tipo" in

                  image/jpeg)
                    extension="jpg"
                    ;;

                  image/png)
                    extension="png"
                    ;;

                  image/gif)
                    extension="gif"
                    ;;

                  image/webp)
                    extension="webp"
                    ;;

                  image/svg+xml)
                    extension="svg"
                    ;;

                  *)
                    echo "Formato no compatible: $tipo"

                    rm -f "$temporal"

                    continue
                    ;;

                esac


                # =================================================
                # NOMBRE FINAL
                # =================================================

                nuevo="doc/imagenes/${id}.${extension}"


                mv "$temporal" "$nuevo"


                nombre=$(basename "$nuevo")


                echo ""
                echo "Imagen guardada:"
                echo "$nuevo"


                # =================================================
                # REEMPLAZAR URL EN EL MARKDOWN
                # =================================================

                python3 - "$archivo" "$url" "$nombre" <<'PY'
import sys
from pathlib import Path

archivo = Path(sys.argv[1])
url = sys.argv[2]
nombre = sys.argv[3]

texto = archivo.read_text(encoding="utf-8")

# URL original
texto = texto.replace(
    url,
    f"./imagenes/{nombre}"
)

archivo.write_text(
    texto,
    encoding="utf-8"
)

print(f"URL reemplazada en: {archivo}")
PY


                echo "Referencia actualizada."


              else

                echo ""
                echo "ERROR: No se pudo descargar:"
                echo "$url"
                echo ""


                rm -f "$temporal"

              fi


            done <<< "$imagenes"


          done < <(
            find doc \
              -type f \
              -name "*.md" \
              -print0
          )


      # =========================================================
      # VERIFICAR IMÁGENES
      # =========================================================

      - name: Verificar imágenes
        run: |

          echo ""
          echo "======================================"
          echo " IMÁGENES DESCARGADAS"
          echo "======================================"
          echo ""

          find doc/imagenes \
            -type f \
            -print \
            | sort

          echo ""

          cantidad=$(find doc/imagenes -type f | wc -l)

          echo "Total de imágenes: $cantidad"


      # =========================================================
      # BUSCAR URLs QUE TODAVÍA QUEDARON
      # =========================================================

      - name: Verificar URLs pendientes
        run: |

          echo ""
          echo "======================================"
          echo " VERIFICANDO URLs EXTERNAS"
          echo "======================================"
          echo ""

          pendientes=$(
            grep -RhoE \
            'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' \
            doc \
            --include="*.md" \
            2>/dev/null \
            | sort -u \
            || true
          )


          if [ -z "$pendientes" ]; then

            echo "OK: No quedan imágenes externas."

          else

            echo "ADVERTENCIA:"
            echo ""
            echo "$pendientes"

          fi


      # =========================================================
      # MOSTRAR CAMBIOS
      # =========================================================

      - name: Mostrar cambios
        run: |

          echo ""
          echo "======================================"
          echo " CAMBIOS DETECTADOS"
          echo "======================================"
          echo ""

          git status

          echo ""
          echo "Resumen:"
          echo ""

          git diff --stat || true


      # =========================================================
      # GUARDAR CAMBIOS
      # =========================================================

      - name: Guardar cambios
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add doc/


          if git diff --cached --quiet
          then

            echo ""
            echo "No hay cambios para guardar."
            echo ""

          else

            echo ""
            echo "Guardando cambios..."
            echo ""


            git commit \
              -m "Descargar y corregir imágenes de documentación"


            git push

          fi
