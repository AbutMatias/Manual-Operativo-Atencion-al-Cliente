name: Convertir imágenes PNG a JPG

on:
  workflow_dispatch:
  push:
    paths:
      - "doc/imagenes/**"
      - "doc/**/*.md"
      - ".github/workflows/descargar-imagenes.yml"

permissions:
  contents: write

jobs:
  convertir-imagenes:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Convertir PNG a JPG
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "     CONVERSIÓN PNG A JPG"
          echo "=============================================="
          echo ""

          mkdir -p doc/imagenes

          cantidad=0

          while IFS= read -r -d '' archivo
          do
            nombre=$(basename "$archivo")
            base="${nombre%.*}"
            destino="doc/imagenes/${base}.jpg"

            echo "PNG encontrado:"
            echo "  $archivo"
            echo "JPG destino:"
            echo "  $destino"
            echo ""

            # Convertir PNG a JPG
            # Fondo blanco para PNG con transparencia
            magick "$archivo" \
              -background white \
              -alpha remove \
              -alpha off \
              -quality 92 \
              "$destino"

            cantidad=$((cantidad + 1))

          done < <(find doc/imagenes -type f \( -iname "*.png" \) -print0)

          echo ""
          echo "=============================================="
          echo "Imágenes convertidas: $cantidad"
          echo "=============================================="

      - name: Actualizar referencias Markdown
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "   ACTUALIZANDO REFERENCIAS MARKDOWN"
          echo "=============================================="
          echo ""

          find doc -type f -name "*.md" -print0 |
          while IFS= read -r -d '' archivo
          do

            echo "Revisando:"
            echo "$archivo"

            python3 - "$archivo" <<'PY'
          import sys
          import re
          from pathlib import Path

          archivo = Path(sys.argv[1])

          texto = archivo.read_text(encoding="utf-8")

          original = texto

          # -------------------------------------------------
          # Cambiar referencias Markdown:
          #
          # ./imagenes/foto.png
          # ->
          # ./imagenes/foto.jpg
          # -------------------------------------------------

          texto = re.sub(
              r'(\./imagenes/[^)\s]+)\.png(?=[)\s"])',
              r'\1.jpg',
              texto,
              flags=re.IGNORECASE
          )

          # -------------------------------------------------
          # Cambiar referencias HTML:
          #
          # src="./imagenes/foto.png"
          # ->
          # src="./imagenes/foto.jpg"
          # -------------------------------------------------

          texto = re.sub(
              r'(\./imagenes/[^"\']+)\.png',
              r'\1.jpg',
              texto,
              flags=re.IGNORECASE
          )

          if texto != original:
              archivo.write_text(texto, encoding="utf-8")
              print(f"MODIFICADO: {archivo}")
          else:
              print(f"SIN CAMBIOS: {archivo}")

          PY

            echo ""

          done

      - name: Mostrar imágenes generadas
        shell: bash
        run: |
          echo "=============================================="
          echo "       IMÁGENES JPG GENERADAS"
          echo "=============================================="
          echo ""

          find doc/imagenes -type f -iname "*.jpg" | sort

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc/imagenes
          git add doc

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Convertir imágenes PNG a JPG y actualizar documentación"
            git push
          fi
