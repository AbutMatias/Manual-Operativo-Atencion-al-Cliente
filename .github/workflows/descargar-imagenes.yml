name: Asignar imágenes locales

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  asignar-imagenes:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Asignar imágenes locales
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "       ASIGNACIÓN DE IMÁGENES LOCALES"
          echo "=============================================="
          echo ""

          mkdir -p doc/imagenes

          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path("doc")
          IMAGENES = ROOT / "imagenes"

          extensiones = {
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".webp",
              ".svg"
          }

          # ==========================================================
          # CREAR ÍNDICE DE TODAS LAS IMÁGENES LOCALES
          # ==========================================================

          archivos = []

          for archivo in IMAGENES.rglob("*"):
              if archivo.is_file() and archivo.suffix.lower() in extensiones:
                  archivos.append(archivo)

          print(f"Imágenes locales encontradas: {len(archivos)}")
          print("")

          # ==========================================================
          # FUNCIÓN PARA OBTENER IDENTIFICADORES
          # ==========================================================

          UUID_RE = re.compile(
              r'(?<![a-zA-Z0-9])'
              r'[0-9a-fA-F]{8}-'
              r'[0-9a-fA-F]{4}-'
              r'[0-9a-fA-F]{4}-'
              r'[0-9a-fA-F]{4}-'
              r'[0-9a-fA-F]{12}'
              r'(?![a-zA-Z0-9])'
          )

          def obtener_uuids(nombre):
              """
              Obtiene todos los UUID que aparecen en el nombre.

              Ejemplo:

              624036160-ef84d419-2766-4f2b-9fb2-db513f133f6c.jpg

              devuelve:

              ef84d419-2766-4f2b-9fb2-db513f133f6c
              """

              return UUID_RE.findall(nombre)

          # ==========================================================
          # ÍNDICE:
          #
          # UUID -> archivo local
          #
          # ==========================================================

          indice = {}

          for archivo in archivos:

              uuids = obtener_uuids(archivo.name)

              for uuid in uuids:

                  uuid = uuid.lower()

                  # Si ya existe, no reemplazarlo.
                  # Evita problemas si hubiera duplicados.
                  if uuid not in indice:
                      indice[uuid] = archivo

          print(f"Identificadores encontrados: {len(indice)}")
          print("")

          # ==========================================================
          # PROCESAR TODOS LOS MARKDOWN
          # ==========================================================

          modificados = 0
          imagenes_asignadas = 0
          imagenes_no_encontradas = 0

          for archivo_md in ROOT.rglob("*.md"):

              # No procesar archivos dentro de doc/imagenes
              if IMAGENES in archivo_md.parents:
                  continue

              print("==============================================")
              print(f"Documento: {archivo_md}")
              print("==============================================")

              texto = archivo_md.read_text(
                  encoding="utf-8"
              )

              original = texto

              # ======================================================
              # BUSCAR:
              #
              # https://github.com/user-attachments/assets/UUID
              #
              # https://user-images.githubusercontent.com/.../UUID.ext
              #
              # ======================================================

              patrones = [
                  re.compile(
                      r'https://github\.com/user-attachments/assets/'
                      r'([0-9a-fA-F-]{36})'
                  ),

                  re.compile(
                      r'https://user-images\.githubusercontent\.com/'
                      r'[^)\s]+/([0-9]+-[0-9a-fA-F-]{36})'
                      r'(?:\.[a-zA-Z0-9]+)?'
                  )
              ]

              urls_encontradas = []

              for patron in patrones:

                  for match in patron.finditer(texto):

                      url = match.group(0)

                      if url not in urls_encontradas:
                          urls_encontradas.append(url)

              # ======================================================
              # PROCESAR CADA URL
              # ======================================================

              for url in urls_encontradas:

                  # --------------------------------------------------
                  # OBTENER UUID DESDE LA URL
                  # --------------------------------------------------

                  encontrados = UUID_RE.findall(url)

                  if not encontrados:
                      print("")
                      print("No se pudo obtener UUID:")
                      print(url)
                      continue

                  uuid = encontrados[-1].lower()

                  print("")
                  print("Imagen detectada:")
                  print(uuid)

                  # --------------------------------------------------
                  # BUSCAR IMAGEN LOCAL
                  # --------------------------------------------------

                  imagen = indice.get(uuid)

                  if imagen is None:

                      print("NO encontrada localmente")
                      print(
                          f"UUID buscado: {uuid}"
                      )

                      imagenes_no_encontradas += 1

                      continue

                  print("Encontrada localmente:")
                  print(imagen)

                  # ==================================================
                  # OBTENER NOMBRE RELATIVO
                  # ==================================================

                  try:
                      relativo = imagen.relative_to(ROOT)
                  except ValueError:
                      print("Error obteniendo ruta relativa")
                      continue

                  referencia = "./" + relativo.as_posix()

                  # ==================================================
                  # REEMPLAZAR TODAS LAS FORMAS
                  #
                  # URL
                  #
                  # [URL](URL)
                  #
                  # ![texto](URL)
                  #
                  # <img src="URL">
                  #
                  # ==================================================

                  # ----------------------------------------------
                  # Caso:
                  #
                  # [URL](URL)
                  # ----------------------------------------------

                  texto = texto.replace(
                      f"[{url}]({url})",
                      referencia
                  )

                  # ----------------------------------------------
                  # Caso:
                  #
                  # ![texto](URL)
                  # ----------------------------------------------

                  patron_imagen = re.compile(
                      r'(!\[[^\]]*\]\()'
                      + re.escape(url)
                      + r'(\))'
                  )

                  texto = patron_imagen.sub(
                      lambda m: m.group(1) + referencia + m.group(2),
                      texto
                  )

                  # ----------------------------------------------
                  # Caso:
                  #
                  # <img src="URL">
                  # ----------------------------------------------

                  texto = texto.replace(
                      f'src="{url}"',
                      f'src="{referencia}"'
                  )

                  texto = texto.replace(
                      f"src='{url}'",
                      f"src='{referencia}'"
                  )

                  # ----------------------------------------------
                  # Caso directo:
                  #
                  # URL
                  # ----------------------------------------------

                  texto = texto.replace(
                      url,
                      referencia
                  )

                  imagenes_asignadas += 1

                  print("Referencia asignada:")
                  print(referencia)

              # ======================================================
              # GUARDAR CAMBIOS
              # ======================================================

              if texto != original:

                  archivo_md.write_text(
                      texto,
                      encoding="utf-8"
                  )

                  modificados += 1

                  print("")
                  print("DOCUMENTO MODIFICADO")

              else:

                  print("")
                  print("SIN CAMBIOS")

              print("")

          # ==========================================================
          # RESUMEN
          # ==========================================================

          print("")
          print("==============================================")
          print("              RESUMEN FINAL")
          print("==============================================")
          print("")
          print(f"Documentos modificados: {modificados}")
          print(f"Imágenes asignadas: {imagenes_asignadas}")
          print(f"Imágenes no encontradas: {imagenes_no_encontradas}")
          print("")
          print("==============================================")

          PY

      - name: Guardar cambios
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "          GUARDANDO CAMBIOS"
          echo "=============================================="
          echo ""

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Asignar imágenes locales a documentación"
            git push
          fi
