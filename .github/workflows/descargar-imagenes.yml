name: Descargar imágenes de documentación

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar-imagenes:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # DESCARGAR REPOSITORIO
      # =========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # =========================================================
      # INSTALAR HERRAMIENTAS
      # =========================================================

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y wget file


      # =========================================================
      # PROCESAR IMÁGENES
      # =========================================================

      - name: Descargar y corregir imágenes
        shell: bash
        run: |

          set +e

          mkdir -p doc/imagenes

          echo ""
          echo "=============================================="
          echo " BUSCANDO IMÁGENES EN /doc"
          echo "=============================================="
          echo ""


          # =====================================================
          # RECORRER TODOS LOS ARCHIVOS MARKDOWN
          # =====================================================

          find doc \
            -type f \
            -name "*.md" \
            -print0 |
          while IFS= read -r -d '' archivo
          do

            echo ""
            echo "----------------------------------------------"
            echo "Documento: $archivo"
            echo "----------------------------------------------"


            # =================================================
            # EXTRAER TODAS LAS URL DE GITHUB USER ATTACHMENTS
            # =================================================

            imagenes=$(
              grep -oE \
              'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' \
              "$archivo" \
              2>/dev/null |
              sort -u
            )


            if [ -z "$imagenes" ]; then

              echo "No contiene imágenes externas."

              continue

            fi


            # =================================================
            # PROCESAR CADA IMAGEN
            # =================================================

            while IFS= read -r url
            do

              [ -z "$url" ] && continue


              id=$(basename "$url")


              echo ""
              echo "Imagen encontrada:"
              echo "$url"


              # =================================================
              # BUSCAR SI YA EXISTE
              # =================================================

              existente=$(
                find doc/imagenes \
                  -type f \
                  -name "${id}.*" \
                  2>/dev/null |
                head -n 1
              )


              if [ -n "$existente" ]; then

                echo "La imagen ya existe:"
                echo "$existente"

                nombre=$(basename "$existente")

              else

                # =============================================
                # ARCHIVO TEMPORAL
                # =============================================

                temporal="doc/imagenes/${id}.download"


                echo "Descargando..."


                wget \
                  --timeout=30 \
                  --tries=3 \
                  --user-agent="Mozilla/5.0" \
                  --referer="https://github.com/" \
                  "$url" \
                  -O "$temporal"


                if [ $? -ne 0 ]; then

                  echo ""
                  echo "ERROR: No se pudo descargar:"
                  echo "$url"
                  echo ""

                  rm -f "$temporal"

                  continue

                fi


                # =============================================
                # DETECTAR TIPO
                # =============================================

                tipo=$(
                  file \
                    --brief \
                    --mime-type \
                    "$temporal" \
                    2>/dev/null
                )


                echo "Tipo detectado: $tipo"


                # =============================================
                # DETERMINAR EXTENSIÓN
                # =============================================

                case "$tipo" in

                  image/jpeg)
                    extension="jpg"
                    ;;

                  image/png)
                    extension="png"
                    ;;

                  image/gif)
                    extension="gif"
                    ;;

                  image/webp)
                    extension="webp"
                    ;;

                  image/svg+xml)
                    extension="svg"
                    ;;

                  *)
                    echo "Formato no compatible: $tipo"

                    rm -f "$temporal"

                    continue
                    ;;

                esac


                # =============================================
                # GUARDAR IMAGEN
                # =============================================

                nuevo="doc/imagenes/${id}.${extension}"


                mv "$temporal" "$nuevo"


                nombre=$(basename "$nuevo")


                echo ""
                echo "Imagen guardada:"
                echo "$nuevo"

              fi


              # =================================================
              # CORREGIR EL DOCUMENTO
              # =================================================

              python3 - "$archivo" "$url" "$nombre" <<'PY'

import sys
from pathlib import Path
import re

archivo = Path(sys.argv[1])
url = sys.argv[2]
nombre = sys.argv[3]

texto = archivo.read_text(encoding="utf-8")

ruta = f"./imagenes/{nombre}"


# =========================================================
# 1. CORREGIR IMG SRC
#
# Convierte:
#
# <img src="URL">
#
# o:
#
# <img src="[URL](URL)">
#
# en:
#
# <img src="./imagenes/imagen.png">
# =========================================================

patron_img = re.compile(
    r'(<img\b[^>]*?\bsrc\s*=\s*["\'])(.*?)(["\'])',
    re.IGNORECASE
)


def corregir_img(match):

    inicio = match.group(1)
    contenido = match.group(2)
    cierre = match.group(3)

    if url in contenido:
        return inicio + ruta + cierre

    return match.group(0)


texto = patron_img.sub(corregir_img, texto)


# =========================================================
# 2. CORREGIR MARKDOWN
#
# Convierte:
#
# ![imagen](URL)
#
# en:
#
# ![imagen](./imagenes/imagen.png)
# =========================================================

texto = texto.replace(
    f"]({url})",
    f"]({ruta})"
)


# =========================================================
# 3. CORREGIR URL SIMPLE
#
# Por si todavía quedó la URL en otro lugar
# =========================================================

texto = texto.replace(
    url,
    ruta
)


# =========================================================
# 4. CORREGIR EL CASO:
#
# [URL](URL)
#
# =========================================================

texto = texto.replace(
    f"[{ruta}]({ruta})",
    ruta
)


archivo.write_text(
    texto,
    encoding="utf-8"
)

print(f"Documento corregido: {archivo}")
print(f"Imagen: {ruta}")

PY


              echo "Referencia actualizada."


            done <<< "$imagenes"


          done


      # =========================================================
      # VERIFICAR IMÁGENES
      # =========================================================

      - name: Verificar imágenes
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo " IMÁGENES DESCARGADAS"
          echo "=============================================="
          echo ""


          find doc/imagenes \
            -type f \
            -print |
          sort


          cantidad=$(
            find doc/imagenes \
              -type f |
            wc -l
          )


          echo ""
          echo "Total de imágenes: $cantidad"


      # =========================================================
      # BUSCAR URLS EXTERNAS RESTANTES
      # =========================================================

      - name: Verificar URLs pendientes
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo " VERIFICANDO URLS EXTERNAS"
          echo "=============================================="
          echo ""


          pendientes=$(
            grep -RhoE \
            'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' \
            doc \
            --include="*.md" \
            2>/dev/null |
            sort -u
          )


          if [ -z "$pendientes" ]; then

            echo "OK: No quedan imágenes externas."

          else

            echo ""
            echo "ADVERTENCIA:"
            echo ""
            echo "Todavía quedan estas URLs:"
            echo ""
            echo "$pendientes"

          fi


      # =========================================================
      # MOSTRAR CAMBIOS
      # =========================================================

      - name: Mostrar cambios
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo " CAMBIOS DETECTADOS"
          echo "=============================================="
          echo ""


          git status


          echo ""
          echo "Resumen:"
          echo ""


          git diff --stat || true


      # =========================================================
      # GUARDAR CAMBIOS
      # =========================================================

      - name: Guardar cambios
        shell: bash
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add doc/


          if git diff --cached --quiet
          then

            echo ""
            echo "No hay cambios para guardar."
            echo ""

          else

            echo ""
            echo "Guardando cambios..."
            echo ""


            git commit \
              -m "Descargar y corregir imágenes de documentación"


            git push

          fi
