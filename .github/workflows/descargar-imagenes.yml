name: Descargar y asignar imágenes

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  descargar-imagenes:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # DESCARGAR REPOSITORIO
      # =========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # =========================================================
      # INSTALAR HERRAMIENTAS
      # =========================================================

      - name: Instalar herramientas
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget file


      # =========================================================
      # PROCESAR DOCUMENTACIÓN
      # =========================================================

      - name: Descargar y asignar imágenes
        shell: bash
        run: |

          echo "=============================================="
          echo " DESCARGAR Y ASIGNAR IMÁGENES"
          echo "=============================================="
          echo ""

          mkdir -p doc/imagenes


          # =====================================================
          # RECORRER TODOS LOS DOCUMENTOS
          # =====================================================

          find doc \
            -type f \
            -name "*.md" \
            -print0 |
          while IFS= read -r -d '' archivo
          do

            echo ""
            echo "----------------------------------------------"
            echo "Documento:"
            echo "$archivo"
            echo "----------------------------------------------"


            # =================================================
            # BUSCAR URLS DE GITHUB USER ATTACHMENTS
            # =================================================

            imagenes=$(
              grep -oE \
                'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' \
                "$archivo" \
                2>/dev/null |
              sort -u
            )


            if [ -z "$imagenes" ]; then

              echo "No contiene imágenes externas."

              continue

            fi


            # =================================================
            # PROCESAR CADA URL
            # =================================================

            while IFS= read -r url
            do

              if [ -z "$url" ]; then
                continue
              fi


              # =================================================
              # OBTENER ID
              # =================================================

              id=$(basename "$url")


              echo ""
              echo "Imagen encontrada:"
              echo "$url"


              # =================================================
              # BUSCAR IMAGEN LOCAL
              # =================================================

              existente=$(
                find doc/imagenes \
                  -type f \
                  -name "${id}.*" \
                  2>/dev/null |
                head -n 1
              )


              # =================================================
              # SI YA EXISTE
              # =================================================

              if [ -n "$existente" ]; then

                echo "Imagen local encontrada:"
                echo "$existente"


                nombre=$(basename "$existente")

                ruta="./imagenes/$nombre"


              else

                # =================================================
                # INTENTAR DESCARGAR
                # =================================================

                echo "Imagen no encontrada localmente."
                echo "Intentando descargar..."


                temporal="doc/imagenes/${id}.download"


                wget \
                  --timeout=30 \
                  --tries=3 \
                  --user-agent="Mozilla/5.0" \
                  --referer="https://github.com/" \
                  "$url" \
                  -O "$temporal"


                resultado=$?


                # =================================================
                # SI NO SE PUDO DESCARGAR
                # =================================================

                if [ $resultado -ne 0 ]; then

                  echo ""
                  echo "NO SE PUDO DESCARGAR:"
                  echo "$url"
                  echo ""
                  echo "La imagen puede ser privada."
                  echo "Si la descargás manualmente,"
                  echo "guardala en:"
                  echo "doc/imagenes/"
                  echo ""

                  rm -f "$temporal"

                  continue

                fi


                # =================================================
                # DETECTAR TIPO
                # =================================================

                tipo=$(
                  file \
                    --brief \
                    --mime-type \
                    "$temporal" \
                    2>/dev/null
                )


                echo "Tipo detectado:"
                echo "$tipo"


                # =================================================
                # DETERMINAR EXTENSIÓN
                # =================================================

                case "$tipo" in

                  image/jpeg)
                    extension="jpg"
                    ;;

                  image/png)
                    extension="png"
                    ;;

                  image/gif)
                    extension="gif"
                    ;;

                  image/webp)
                    extension="webp"
                    ;;

                  image/svg+xml)
                    extension="svg"
                    ;;

                  *)
                    echo ""
                    echo "Formato no compatible:"
                    echo "$tipo"
                    echo ""

                    rm -f "$temporal"

                    continue
                    ;;

                esac


                # =================================================
                # GUARDAR IMAGEN
                # =================================================

                nuevo="doc/imagenes/${id}.${extension}"


                mv "$temporal" "$nuevo"


                nombre=$(basename "$nuevo")


                ruta="./imagenes/$nombre"


                echo ""
                echo "Imagen guardada:"
                echo "$nuevo"

              fi


              # =================================================
              # REEMPLAZAR URL EN DOCUMENTO
              # =================================================

              echo ""
              echo "Asignando imagen:"
              echo "$ruta"


              sed -i \
                "s|$url|$ruta|g" \
                "$archivo"


            done <<< "$imagenes"


          done


      # =========================================================
      # CORREGIR HTML DE IMÁGENES
      # =========================================================

      - name: Corregir referencias HTML
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo " CORRIGIENDO REFERENCIAS HTML"
          echo "=============================================="
          echo ""


          find doc \
            -type f \
            -name "*.md" \
            -print0 |
          while IFS= read -r -d '' archivo
          do

            echo "Revisando:"
            echo "$archivo"


            # =================================================
            # CASO:
            #
            # src="[URL](URL)"
            #
            # =================================================

            sed -E -i \
              's|src="(\[[^]]+\]\([^)]*\))"|src="\2"|g' \
              "$archivo"


            # =================================================
            # CASO CON COMILLAS SIMPLES
            # =================================================

            sed -E -i \
              "s|src='(\[[^]]+\]\([^)]*\))'|src='\2'|g" \
              "$archivo"


          done


      # =========================================================
      # VERIFICAR IMÁGENES
      # =========================================================

      - name: Verificar imágenes
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo " IMÁGENES EN DOC/IMAGENES"
          echo "=============================================="
          echo ""


          find doc/imagenes \
            -type f \
            -print |
          sort


          cantidad=$(
            find doc/imagenes \
              -type f |
            wc -l
          )


          echo ""
          echo "Total de imágenes:"
          echo "$cantidad"


      # =========================================================
      # VERIFICAR URLS QUE QUEDARON
      # =========================================================

      - name: Verificar imágenes pendientes
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo " IMÁGENES PENDIENTES"
          echo "=============================================="
          echo ""


          pendientes=$(
            grep -RhoE \
              'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' \
              doc \
              --include="*.md" \
              2>/dev/null |
            sort -u
          )


          if [ -z "$pendientes" ]; then

            echo "=============================================="
            echo " OK"
            echo " NO QUEDAN URLs EXTERNAS"
            echo "=============================================="

          else

            echo "=============================================="
            echo " ATENCION"
            echo "=============================================="
            echo ""
            echo "Estas imágenes todavía no fueron asignadas:"
            echo ""
            echo "$pendientes"
            echo ""

          fi


      # =========================================================
      # MOSTRAR CAMBIOS
      # =========================================================

      - name: Mostrar cambios
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo " CAMBIOS DETECTADOS"
          echo "=============================================="
          echo ""


          git status


          echo ""
          echo "Resumen:"
          echo ""


          git diff --stat || true


      # =========================================================
      # GUARDAR CAMBIOS
      # =========================================================

      - name: Guardar cambios
        shell: bash
        run: |

          echo ""
          echo "=============================================="
          echo " GUARDANDO CAMBIOS"
          echo "=============================================="
          echo ""


          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add doc/


          if git diff --cached --quiet
          then

            echo ""
            echo "No hay cambios para guardar."
            echo ""

          else

            echo ""
            echo "Creando commit..."
            echo ""


            git commit \
              -m "Descargar y asignar imágenes de documentación"


            echo ""
            echo "Subiendo cambios..."
            echo ""


            git push

          fi
