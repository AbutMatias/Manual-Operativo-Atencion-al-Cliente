name: Descargar imágenes de documentación

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  descargar-imagenes:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y wget file


      - name: Descargar imágenes
        shell: bash
        run: |
          set +e

          mkdir -p doc/imagenes

          echo "======================================"
          echo " BUSCANDO IMÁGENES"
          echo "======================================"

          find doc -type f -name "*.md" -print0 |
          while IFS= read -r -d '' archivo
          do

            echo ""
            echo "Documento: $archivo"

            grep -oE 'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' "$archivo" 2>/dev/null |
            sort -u |
            while IFS= read -r url
            do

              [ -z "$url" ] && continue

              id=$(basename "$url")

              echo ""
              echo "Imagen encontrada:"
              echo "$url"

              existente=$(find doc/imagenes -type f -name "${id}.*" 2>/dev/null | head -n 1)

              if [ -n "$existente" ]; then

                echo "Ya existe:"
                echo "$existente"

                nombre=$(basename "$existente")

              else

                temporal="doc/imagenes/${id}.download"

                echo "Descargando..."

                wget \
                  --timeout=30 \
                  --tries=3 \
                  --user-agent="Mozilla/5.0" \
                  --referer="https://github.com/" \
                  "$url" \
                  -O "$temporal"

                if [ $? -ne 0 ]; then

                  echo "ERROR: No se pudo descargar $url"

                  rm -f "$temporal"

                  continue

                fi

                tipo=$(file --brief --mime-type "$temporal" 2>/dev/null)

                echo "Tipo detectado: $tipo"

                case "$tipo" in

                  image/jpeg)
                    extension="jpg"
                    ;;

                  image/png)
                    extension="png"
                    ;;

                  image/gif)
                    extension="gif"
                    ;;

                  image/webp)
                    extension="webp"
                    ;;

                  image/svg+xml)
                    extension="svg"
                    ;;

                  *)
                    echo "Formato no compatible: $tipo"
                    rm -f "$temporal"
                    continue
                    ;;

                esac

                nuevo="doc/imagenes/${id}.${extension}"

                mv "$temporal" "$nuevo"

                nombre=$(basename "$nuevo")

                echo "Imagen guardada:"
                echo "$nuevo"

              fi


              # ==================================================
              # CORREGIR REFERENCIAS EN MARKDOWN
              # ==================================================

              ruta="./imagenes/$nombre"

              echo "Corrigiendo referencia..."

              sed -i "s|$url|$ruta|g" "$archivo"


              # ==================================================
              # CORREGIR CASOS COMO:
              #
              # [URL](URL)
              #
              # ==================================================

              sed -i "s|\[$ruta\]($ruta)|$ruta|g" "$archivo"


              # ==================================================
              # CORREGIR IMG SRC
              #
              # src="[URL](URL)"
              # ==================================================

              sed -i "s|src=\"\[$url\]($url)\"|src=\"$ruta\"|g" "$archivo"

              sed -i "s|src='\[$url\]($url)'|src='$ruta'|g" "$archivo"


              echo "Referencia actualizada."

            done

          done


      - name: Corregir referencias de imágenes
        shell: bash
        run: |

          echo "======================================"
          echo " CORRIGIENDO REFERENCIAS"
          echo "======================================"

          find doc -type f -name "*.md" -print0 |
          while IFS= read -r -d '' archivo
          do

            echo "Revisando: $archivo"

            for imagen in doc/imagenes/*
            do

              [ -f "$imagen" ] || continue

              nombre=$(basename "$imagen")

              id="${nombre%.*}"

              ruta="./imagenes/$nombre"

              url="https://github.com/user-attachments/assets/$id"


              # URL directa
              sed -i "s|$url|$ruta|g" "$archivo"


              # [URL](URL)
              sed -i "s|\[$url\]($url)|$ruta|g" "$archivo"


              # src="[URL](URL)"
              sed -i "s|src=\"\[$url\]($url)\"|src=\"$ruta\"|g" "$archivo"


              # src='[URL](URL)'
              sed -i "s|src='\[$url\]($url)'|src='$ruta'|g" "$archivo"

            done

          done


      - name: Mostrar imágenes
        shell: bash
        run: |

          echo "======================================"
          echo " IMÁGENES ENCONTRADAS"
          echo "======================================"

          find doc/imagenes -type f | sort

          echo ""

          cantidad=$(find doc/imagenes -type f | wc -l)

          echo "Total: $cantidad"


      - name: Mostrar cambios
        shell: bash
        run: |

          echo "======================================"
          echo " CAMBIOS"
          echo "======================================"

          git status

          echo ""

          git diff --stat || true


      - name: Guardar cambios
        shell: bash
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc/

          if git diff --cached --quiet
          then

            echo "No hay cambios para guardar."

          else

            git commit \
              -m "Descargar y corregir imágenes de documentación"

            git push

          fi
