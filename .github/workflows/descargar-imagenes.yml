name: Corregir imágenes locales

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corregir-imagenes:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corregir referencias de imágenes
        shell: bash
        run: |

          echo "=============================================="
          echo "     CORRECCIÓN DE IMÁGENES LOCALES"
          echo "=============================================="
          echo ""

          mkdir -p doc/imagenes

          python3 <<'PY'

          from pathlib import Path
          import re

          carpeta = Path("doc")
          imagenes = Path("doc/imagenes")

          extensiones = {
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".webp",
              ".svg"
          }

          archivos_imagen = sorted(
              [
                  p for p in imagenes.iterdir()
                  if p.is_file() and p.suffix.lower() in extensiones
              ],
              key=lambda p: p.name.lower()
          )

          print("Imágenes locales encontradas:")
          print("")

          for imagen in archivos_imagen:
              print(" -", imagen.name)

          print("")
          print("Total:", len(archivos_imagen))
          print("")

          # -------------------------------------------------
          # BUSCAR DOCUMENTOS
          # -------------------------------------------------

          documentos = sorted(carpeta.rglob("*.md"))

          contador_global = 0

          for archivo in documentos:

              if "imagenes" in archivo.parts:
                  continue

              texto = archivo.read_text(
                  encoding="utf-8",
                  errors="ignore"
              )

              original = texto

              print("")
              print("==============================================")
              print("Documento:", archivo)
              print("==============================================")

              # -------------------------------------------------
              # BUSCAR TODAS LAS URL DE IMÁGENES
              # -------------------------------------------------

              patron = re.compile(
                  r'https://(?:github\.com/user-attachments/assets|user-images\.githubusercontent\.com)/[A-Za-z0-9._~:/?#\[\]@!$&\'()*+,;=%-]+'
              )

              urls = []

              for coincidencia in patron.findall(texto):

                  # Limpiar caracteres que pueden venir
                  # pegados al final de la URL
                  url = coincidencia.rstrip(')>"]')

                  if url not in urls:
                      urls.append(url)

              if not urls:
                  print("Sin imágenes externas.")
                  continue

              print("Imágenes externas:", len(urls))

              # -------------------------------------------------
              # REEMPLAZAR IMÁGENES
              # -------------------------------------------------

              for url in urls:

                  if contador_global >= len(archivos_imagen):

                      print("")
                      print("NO HAY MÁS IMÁGENES LOCALES DISPONIBLES")
                      print("URL:", url)
                      continue

                  imagen = archivos_imagen[contador_global]

                  nombre = imagen.name

                  referencia = f"./imagenes/{nombre}"

                  print("")
                  print("URL:")
                  print(url)

                  print("Asignando:")
                  print(nombre)

                  # -------------------------------------------------
                  # CASO:
                  # [URL](URL)
                  # -------------------------------------------------

                  texto = texto.replace(
                      f"[{url}]({url})",
                      referencia
                  )

                  # -------------------------------------------------
                  # CASO:
                  # <img src="[URL](URL)" ...>
                  # -------------------------------------------------

                  texto = texto.replace(
                      f'src="[{url}]({url})"',
                      f'src="{referencia}"'
                  )

                  texto = texto.replace(
                      f"src='[{url}]({url})'",
                      f"src='{referencia}'"
                  )

                  # -------------------------------------------------
                  # CASO:
                  # <img src="URL" ...>
                  # -------------------------------------------------

                  texto = texto.replace(
                      f'src="{url}"',
                      f'src="{referencia}"'
                  )

                  texto = texto.replace(
                      f"src='{url}'",
                      f"src='{referencia}'"
                  )

                  # -------------------------------------------------
                  # CASO:
                  # URL SOLA
                  # -------------------------------------------------

                  texto = texto.replace(
                      url,
                      referencia
                  )

                  contador_global += 1

              # -------------------------------------------------
              # GUARDAR
              # -------------------------------------------------

              if texto != original:

                  archivo.write_text(
                      texto,
                      encoding="utf-8"
                  )

                  print("")
                  print("DOCUMENTO MODIFICADO")

              else:

                  print("")
                  print("SIN CAMBIOS")

          print("")
          print("==============================================")
          print("PROCESO FINALIZADO")
          print("==============================================")
          print("")
          print("Imágenes asignadas:", contador_global)

          PY

      - name: Mostrar cambios
        shell: bash
        run: |

          echo "=============================================="
          echo "CAMBIOS"
          echo "=============================================="

          git status

          echo ""
          git diff --stat

      - name: Guardar cambios
        shell: bash
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc/

          if git diff --cached --quiet
          then
            echo "No hay cambios para guardar."
          else
            git commit -m "Corregir referencias de imágenes locales"
            git push
          fi
