name: Descargar y asignar imágenes de documentación

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar-imagenes:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # DESCARGAR REPOSITORIO
      # =========================================================

      - name: Descargar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # =========================================================
      # PROCESAR DOCUMENTACIÓN
      # =========================================================

      - name: Asignar imágenes a documentos
        shell: bash
        run: |

          set +e

          echo "=============================================="
          echo "   ASIGNAR IMÁGENES DE DOCUMENTACIÓN"
          echo "=============================================="
          echo ""

          mkdir -p doc/imagenes


          # =====================================================
          # CONTADORES
          # =====================================================

          procesadas=0
          asignadas=0
          pendientes=0


          # =====================================================
          # RECORRER TODOS LOS DOCUMENTOS
          # =====================================================

          while IFS= read -r -d '' archivo
          do

            echo ""
            echo "----------------------------------------------"
            echo "Documento:"
            echo "$archivo"
            echo "----------------------------------------------"


            # =================================================
            # BUSCAR URLs DE GITHUB USER ATTACHMENTS
            # =================================================

            grep -oE \
              'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' \
              "$archivo" \
              2>/dev/null |
              sort -u |
              while IFS= read -r url
            do

              if [ -z "$url" ]; then
                continue
              fi


              procesadas=$((procesadas + 1))


              # =================================================
              # OBTENER ID
              # =================================================

              id=$(basename "$url")


              echo ""
              echo "Imagen encontrada:"
              echo "$url"

              echo "ID:"
              echo "$id"


              # =================================================
              # BUSCAR IMAGEN LOCAL
              # =================================================

              imagen_local=""


              for extension in jpg jpeg png gif webp svg JPG JPEG PNG GIF WEBP SVG
              do

                candidato="doc/imagenes/${id}.${extension}"

                if [ -f "$candidato" ]; then
                  imagen_local="$candidato"
                  break
                fi

              done


              # =================================================
              # SI EXISTE LA IMAGEN LOCAL
              # =================================================

              if [ -n "$imagen_local" ]; then

                nombre=$(basename "$imagen_local")

                echo "Imagen local encontrada:"
                echo "$imagen_local"


                # =================================================
                # REEMPLAZAR URL NORMAL
                # =================================================

                sed -i \
                  "s|$url|./imagenes/$nombre|g" \
                  "$archivo"


                # =================================================
                # CORREGIR FORMATO:
                #
                # [URL](URL)
                # =================================================

                sed -i \
                  "s|\[$url\]($url)|./imagenes/$nombre|g" \
                  "$archivo"


                # =================================================
                # CORREGIR HTML:
                #
                # <img src="URL">
                # =================================================

                sed -i \
                  "s|src=\"$url\"|src=\"./imagenes/$nombre\"|g" \
                  "$archivo"


                # =================================================
                # CORREGIR HTML RARO:
                #
                # src="[URL](URL)"
                # =================================================

                sed -i \
                  "s|src=\"\[$url\]($url)\"|src=\"./imagenes/$nombre\"|g" \
                  "$archivo"


                echo "Referencia corregida:"
                echo "./imagenes/$nombre"


                asignadas=$((asignadas + 1))


              else

                echo ""
                echo "AVISO:"
                echo "No existe una imagen local para:"
                echo "$id"

                echo ""
                echo "Debe existir como:"
                echo "doc/imagenes/${id}.png"
                echo "doc/imagenes/${id}.jpg"
                echo "doc/imagenes/${id}.jpeg"
                echo "doc/imagenes/${id}.webp"
                echo ""

                pendientes=$((pendientes + 1))

              fi

            done

          done < <(
            find doc \
              -type f \
              -name "*.md" \
              -print0
          )


          # =====================================================
          # MOSTRAR RESUMEN
          # =====================================================

          echo ""
          echo "=============================================="
          echo "              RESUMEN"
          echo "=============================================="
          echo ""

          echo "URLs encontradas: $procesadas"
          echo "Imágenes asignadas: $asignadas"
          echo "Imágenes pendientes: $pendientes"

          echo ""


      # =========================================================
      # VERIFICAR IMÁGENES
      # =========================================================

      - name: Verificar imágenes
        shell: bash
        run: |

          echo "=============================================="
          echo "        IMÁGENES EN DOC/IMAGENES"
          echo "=============================================="
          echo ""

          if [ -d "doc/imagenes" ]; then

            find doc/imagenes \
              -type f \
              -print |
              sort

          else

            echo "La carpeta doc/imagenes no existe."

          fi

          echo ""


      # =========================================================
      # BUSCAR IMÁGENES EXTERNAS RESTANTES
      # =========================================================

      - name: Verificar referencias externas
        shell: bash
        run: |

          echo "=============================================="
          echo "       REFERENCIAS EXTERNAS RESTANTES"
          echo "=============================================="
          echo ""

          pendientes=$(
            grep -RhoE \
              'https://github\.com/user-attachments/assets/[a-zA-Z0-9-]+' \
              doc \
              --include="*.md" \
              2>/dev/null |
              sort -u
          )


          if [ -z "$pendientes" ]; then

            echo "OK."
            echo "No quedan referencias externas."

          else

            echo "Las siguientes referencias todavía no fueron reemplazadas:"
            echo ""

            echo "$pendientes"

          fi


          echo ""


      # =========================================================
      # MOSTRAR CAMBIOS
      # =========================================================

      - name: Mostrar cambios
        shell: bash
        run: |

          echo "=============================================="
          echo "              CAMBIOS"
          echo "=============================================="
          echo ""

          git status

          echo ""

          git diff --stat || true

          echo ""


      # =========================================================
      # GUARDAR CAMBIOS
      # =========================================================

      - name: Guardar cambios
        shell: bash
        run: |

          echo "=============================================="
          echo "             GUARDAR CAMBIOS"
          echo "=============================================="
          echo ""


          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add doc/


          if git diff --cached --quiet
          then

            echo "No hay cambios para guardar."

          else

            echo ""
            echo "Cambios encontrados."

            echo ""

            git commit \
              -m "Asignar imágenes locales a documentación"


            git push

            echo ""
            echo "Cambios enviados correctamente."

          fi
