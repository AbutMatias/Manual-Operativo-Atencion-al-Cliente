name: Convertir imágenes PNG a JPG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convertir-imagenes:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

      - name: Convertir PNG a JPG
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "        CONVERSIÓN PNG A JPG"
          echo "=============================================="
          echo ""

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image

          carpeta = Path("doc/imagenes")

          cantidad = 0

          for archivo in carpeta.rglob("*"):
              if not archivo.is_file():
                  continue

              if archivo.suffix.lower() != ".png":
                  continue

              destino = archivo.with_suffix(".jpg")

              print("----------------------------------------------")
              print(f"PNG encontrado:")
              print(archivo)
              print(f"JPG destino:")
              print(destino)

              try:
                  imagen = Image.open(archivo)

                  # Convertir imágenes con transparencia
                  # sobre fondo blanco.
                  if imagen.mode in ("RGBA", "LA") or (
                      imagen.mode == "P"
                      and "transparency" in imagen.info
                  ):
                      fondo = Image.new("RGB", imagen.size, "white")

                      if imagen.mode == "P":
                          imagen = imagen.convert("RGBA")

                      fondo.paste(
                          imagen,
                          mask=imagen.getchannel("A")
                      )

                      imagen = fondo

                  else:
                      imagen = imagen.convert("RGB")

                  imagen.save(
                      destino,
                      "JPEG",
                      quality=92,
                      optimize=True
                  )

                  print("OK")
                  cantidad += 1

              except Exception as e:
                  print(f"ERROR: {archivo}")
                  print(e)
                  raise

          print("")
          print("==============================================")
          print(f"IMÁGENES CONVERTIDAS: {cantidad}")
          print("==============================================")
          PY

      - name: Actualizar referencias PNG a JPG
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "     ACTUALIZANDO REFERENCIAS"
          echo "=============================================="
          echo ""

          find doc -type f -name "*.md" -print0 |
          while IFS= read -r -d '' archivo
          do
              echo "Revisando:"
              echo "$archivo"

              python3 - "$archivo" <<'PY'
          import sys
          import re
          from pathlib import Path

          archivo = Path(sys.argv[1])

          texto = archivo.read_text(encoding="utf-8")

          original = texto

          # ------------------------------------------
          # Markdown
          #
          # ./imagenes/foto.png
          # ->
          # ./imagenes/foto.jpg
          # ------------------------------------------

          texto = re.sub(
              r'(\./imagenes/[^)\s]+)\.png(?=[)\s])',
              r'\1.jpg',
              texto,
              flags=re.IGNORECASE
          )

          # ------------------------------------------
          # HTML
          #
          # src="./imagenes/foto.png"
          # ->
          # src="./imagenes/foto.jpg"
          # ------------------------------------------

          texto = re.sub(
              r'(\./imagenes/[^"\']+)\.png',
              r'\1.jpg',
              texto,
              flags=re.IGNORECASE
          )

          if texto != original:
              archivo.write_text(
                  texto,
                  encoding="utf-8"
              )

              print(f"MODIFICADO: {archivo}")

          else:
              print(f"SIN CAMBIOS: {archivo}")

          PY

              echo ""

          done

      - name: Mostrar JPG generados
        run: |
          echo "=============================================="
          echo "          JPG GENERADOS"
          echo "=============================================="
          echo ""

          find doc/imagenes \
            -type f \
            -iname "*.jpg" \
            -print |
          sort

      - name: Guardar cambios
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add doc/imagenes
          git add doc

          if git diff --cached --quiet; then
              echo "No hay cambios para guardar."
          else
              git commit -m "Convertir imágenes PNG a JPG"
              git push
          fi
