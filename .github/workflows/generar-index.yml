name: Generar índice de documentación

on:

  push:

    branches:
      - main

    paths:
      - "doc/**/*.md"
      - "generar_index.py"
      - ".github/workflows/generar-index.yml"

  workflow_dispatch:


permissions:

  contents: write


jobs:

  generar-index:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4


      - name: Configurar Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      - name: Generar index.json
        run: python generar_index.py


      - name: Verificar cambios
        run: git diff --stat


      - name: Guardar index.json
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.json

          git diff --cached --quiet || git commit -m "Actualizar índice de documentación"

          git push
