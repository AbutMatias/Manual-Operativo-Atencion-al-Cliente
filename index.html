<meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Manual Operativo - Atención al Cliente">
	

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>

        /* =========================================================
           VARIABLES
        ========================================================= */

        :root {

            --background: #f4f6f8;
            --sidebar: #ffffff;
            --header: #ffffff;
            --panel: #ffffff;
            --panel-hover: #f1f5f8;
            --input: #f3f5f7;

            --border: #e0e5e9;

            --text: #20252a;
            --text-secondary: #68727c;
            --text-muted: #929ba3;

            --blue: #159bd3;
            --blue-dark: #087cac;
            --blue-light: rgba(21, 155, 211, .12);

            --important: #e9a43a;

            --shadow:
                0 4px 18px rgba(0, 0, 0, .06);

            --radius: 10px;
        }


        /* DARK MODE */

        body.dark {

            --background: #181a1d;
            --sidebar: #202225;
            --header: #1d1f22;
            --panel: #24272b;
            --panel-hover: #2b2f34;
            --input: #2b2f34;

            --border: #383d43;

            --text: #f2f4f5;
            --text-secondary: #aeb6bd;
            --text-muted: #747d85;

            --blue: #5bc0eb;
            --blue-dark: #3ca8d1;
            --blue-light: rgba(91, 192, 235, .13);

            --important: #f0ad4e;

            --shadow:
                0 5px 20px rgba(0, 0, 0, .25);
        }


        /* =========================================================
           GENERAL
        ========================================================= */

        * {
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;

            background: var(--background);

            color: var(--text);

            transition:
                background .2s,
                color .2s;
        }


        button,
        input {
            font-family: inherit;
        }


        button {
            outline: none;
        }


        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }


        ::-webkit-scrollbar-track {
            background: var(--background);
        }


        ::-webkit-scrollbar-thumb {

            background: #777;

            border-radius: 10px;
        }


        ::-webkit-scrollbar-thumb:hover {
            background: var(--blue);
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .header {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 68px;

            z-index: 1000;

            background: var(--header);

            border-bottom:
                1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;

            box-shadow:
                0 2px 12px rgba(0,0,0,.04);
        }


        .header-left {

            display: flex;

            align-items: center;

            gap: 13px;
        }


        .menu-button {

            width: 40px;
            height: 40px;

            border: none;

            border-radius: 8px;

            background: var(--panel-hover);

            color: var(--text);

            font-size: 20px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .menu-button:hover {

            background: var(--blue);

            color: white;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;
        }


        .brand-logo {

            width: 35px;
            height: 35px;

            object-fit: contain;
        }


        .brand-name {

            font-size: 16px;

            font-weight: 700;

            color: var(--text);
        }


        .header-right {

            display: flex;

            align-items: center;

            gap: 9px;
        }


        .header-status {

            padding: 8px 12px;

            border-radius: 7px;

            background: var(--blue-light);

            color: var(--blue);

            font-size: 11px;

            font-weight: 700;
        }


        .theme-button,
        .github-button {

            height: 38px;

            border-radius: 7px;

            border: 1px solid var(--border);

            background: var(--panel);

            color: var(--text);

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 0 12px;

            text-decoration: none;

            font-size: 12px;

            transition: .15s;
        }


        .theme-button:hover,
        .github-button:hover {

            border-color: var(--blue);

            color: var(--blue);
        }


 /* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    position: fixed;

    left: 0;
    top: 68px;
    bottom: 0;

    width: 310px;

    z-index: 900;

    background: var(--sidebar);

    border-right:
        1px solid var(--border);

    overflow-y: auto;

    transform: translateX(0);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}


/* =========================================================
   SIDEBAR OCULTA
========================================================= */

body.sidebar-hidden .sidebar {

    transform:
        translateX(-100%);
}


/* =========================================================
   MAIN CUANDO SIDEBAR ESTÁ VISIBLE
========================================================= */

.main {

    margin-left: 310px;

    transition:
        margin-left .25s ease;
}


/* =========================================================
   MAIN CUANDO SIDEBAR ESTÁ OCULTA
========================================================= */

body.sidebar-hidden .main {

    margin-left: 0;
}


/* =========================================================
   SIDEBAR TOP
========================================================= */

.sidebar-top {

    padding: 16px 14px 8px;
}


/* =========================================================
   SECCIONES
========================================================= */

.sidebar-section {

    padding: 17px 15px 8px;

    color: var(--text-muted);

    font-size: 10px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: .7px;
}


/* =========================================================
   BUSCADOR SIDEBAR
========================================================= */

.sidebar-search {

    padding: 0 14px 12px;
}


.sidebar-search input {

    width: 100%;

    height: 38px;

    padding: 0 11px;

    border:
        1px solid var(--border);

    outline: none;

    border-radius: 7px;

    background: var(--input);

    color: var(--text);

    font-size: 12px;

    transition:
        border-color .15s,
        box-shadow .15s;
}


.sidebar-search input::placeholder {

    color: var(--text-muted);
}


.sidebar-search input:focus {

    border-color: var(--blue);

    box-shadow:
        0 0 0 2px var(--blue-light);
}


/* =========================================================
   NAVEGACIÓN
========================================================= */

.nav {

    padding: 0 8px;
}


.nav-item {

    display: flex;

    align-items: center;

    gap: 9px;

    padding: 9px 10px;

    margin-bottom: 3px;

    border-radius: 7px;

    color: var(--text-secondary);

    font-size: 12px;

    cursor: pointer;

    transition:
        background .15s,
        color .15s;
}


.nav-item:hover {

    background: var(--panel-hover);

    color: var(--text);
}


.nav-item.active {

    background: var(--blue-light);

    color: var(--blue);

    font-weight: 700;
}


.category-icon {

    width: 18px;

    min-width: 18px;

    text-align: center;
}


/* =========================================================
   QUICK ACCESS
========================================================= */

.quick-access {

    display: flex;

    flex-wrap: wrap;

    gap: 6px;

    padding: 0 14px 12px;
}


.quick-button {

    border:
        1px solid var(--border);

    background: var(--input);

    color: var(--text-secondary);

    border-radius: 6px;

    padding: 6px 8px;

    font-size: 10px;

    cursor: pointer;

    transition:
        border-color .15s,
        color .15s,
        background .15s;
}


.quick-button:hover {

    border-color: var(--blue);

    color: var(--blue);

    background: var(--panel-hover);
}


/* =========================================================
   FAVORITES / HISTORY
========================================================= */

.special-list {

    padding: 0 8px;
}


.special-item {

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 7px 9px;

    border-radius: 6px;

    color: var(--text-secondary);

    font-size: 11px;

    cursor: pointer;

    transition:
        background .15s,
        color .15s;
}


.special-item:hover {

    background: var(--panel-hover);

    color: var(--text);
}


.empty-special {

    padding: 6px 10px;

    color: var(--text-muted);

    font-size: 10px;
}


/* =========================================================
   CATEGORÍAS
========================================================= */

.sidebar-category {

    margin-bottom: 2px;
}


.sidebar-category-title {

    font-weight: 700;

    user-select: none;
}


.sidebar-category-name {

    flex: 1;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}


.category-count {

    color: var(--text-muted);

    font-size: 9px;

    margin-left: 4px;
}


.sidebar-arrow {

    color: var(--text-muted);

    font-size: 17px;

    transition:
        transform .15s,
        color .15s;
}


.sidebar-category-title.expanded .sidebar-arrow {

    transform:
        rotate(90deg);

    color: var(--blue);
}


.sidebar-category-content {

    display: none;

    padding-left: 13px;
}


.sidebar-category-content.open {

    display: block;
}


/* =========================================================
   DOCUMENTOS
========================================================= */

.sidebar-document {

    display: flex;

    align-items: flex-start;

    gap: 7px;

    padding: 7px 9px;

    margin: 1px 0;

    border-radius: 6px;

    color: var(--text-secondary);

    font-size: 11px;

    line-height: 1.4;

    cursor: pointer;

    transition:
        background .15s,
        color .15s;
}


.sidebar-document:hover {

    background: var(--panel-hover);

    color: var(--text);
}


.sidebar-document.important {

    color: var(--important);

    font-weight: 600;
}


/* =========================================================
   FAVORITOS
========================================================= */

.favorite-star {

    margin-left: auto;

    opacity: .45;

    cursor: pointer;

    flex-shrink: 0;

    transition:
        opacity .15s,
        color .15s,
        transform .15s;
}


.favorite-star:hover {

    opacity: 1;

    color: #f0ad4e;

    transform: scale(1.1);
}


.favorite-star.active {

    opacity: 1;

    color: #f0ad4e;
}


/* =========================================================
   SCROLLBAR SIDEBAR
========================================================= */

.sidebar::-webkit-scrollbar {

    width: 6px;
}


.sidebar::-webkit-scrollbar-track {

    background: transparent;
}


.sidebar::-webkit-scrollbar-thumb {

    background: var(--border);

    border-radius: 10px;
}


.sidebar::-webkit-scrollbar-thumb:hover {

    background: var(--text-muted);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    .sidebar {

        width: 310px;

        transform:
            translateX(-100%);

        box-shadow:
            8px 0 30px rgba(0, 0, 0, .35);
    }


    .sidebar.open {

        transform:
            translateX(0);
    }


    body.sidebar-hidden .sidebar {

        transform:
            translateX(-100%);
    }


    .main {

        margin-left: 0;
    }


    body.sidebar-hidden .main {

        margin-left: 0;
    }

}


        /* =========================================================
           MAIN
        ========================================================= */

        .main {

            margin-left: 310px;

            padding-top: 68px;

            min-height: 100vh;

            transition:
                margin-left .25s ease;
        }


        .content {

            max-width: 1350px;

            margin: auto;

            padding: 30px;
        }


        /* =========================================================
           HERO
        ========================================================= */

        .hero {

            position: relative;

            background:
                linear-gradient(
                    135deg,
                    var(--panel),
                    var(--panel-hover)
                );

            border:
                1px solid var(--border);

            border-radius: 14px;

            padding: 32px;

            margin-bottom: 18px;

            overflow: hidden;

            box-shadow: var(--shadow);
        }


        .hero::after {

            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            right: -70px;
            top: -90px;

            border-radius: 50%;

            background:
                var(--blue-light);

            pointer-events: none;
        }


        .hero-title {

            margin: 0;

            font-size: 29px;

            color: var(--text);

            position: relative;

            z-index: 1;
        }


        .hero-subtitle {

            margin: 9px 0 0;

            max-width: 800px;

            color: var(--text-secondary);

            font-size: 13px;

            line-height: 1.6;

            position: relative;

            z-index: 1;
        }


        /* =========================================================
           SEARCH
        ========================================================= */

        .main-search {

            margin-top: 24px;

            position: relative;

            z-index: 2;
        }


        .main-search-wrapper {
            position: relative;
        }


        .main-search-icon {

            position: absolute;

            left: 15px;
            top: 50%;

            transform:
                translateY(-50%);

            color: var(--text-muted);

            pointer-events: none;
        }


        .main-search input {

            width: 100%;

            height: 52px;

            padding: 0 50px;

            border:
                1px solid var(--border);

            border-radius: 9px;

            outline: none;

            background: var(--input);

            color: var(--text);

            font-size: 14px;

            transition: .15s;
        }


        .main-search input:focus {

            border-color: var(--blue);

            box-shadow:
                0 0 0 3px var(--blue-light);
        }


        .clear-search {

            position: absolute;

            right: 10px;
            top: 50%;

            transform:
                translateY(-50%);

            width: 30px;
            height: 30px;

            border: none;

            border-radius: 6px;

            background: transparent;

            color: var(--text-muted);

            cursor: pointer;

            display: none;
        }


        .clear-search:hover {

            background: var(--panel-hover);

            color: var(--text);
        }


        /* =========================================================
           STATS
        ========================================================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-bottom: 20px;
        }


        .stat {

            background: var(--panel);

            border:
                1px solid var(--border);

            border-radius: 10px;

            padding: 17px;

            box-shadow: var(--shadow);
        }


        .stat-number {

            font-size: 21px;

            font-weight: 800;

            color: var(--blue);
        }


        .stat-label {

            margin-top: 4px;

            color: var(--text-muted);

            font-size: 11px;
        }


        /* =========================================================
           QUICK HOME
        ========================================================= */

        .home-section-title {

            margin: 22px 0 10px;

            font-size: 14px;

            font-weight: 800;
        }


        .home-quick {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(170px, 1fr));

            gap: 10px;

            margin-bottom: 24px;
        }


        .home-quick-button {

            border:
                1px solid var(--border);

            background: var(--panel);

            color: var(--text);

            border-radius: 9px;

            padding: 13px;

            text-align: left;

            cursor: pointer;

            transition: .15s;
        }


        .home-quick-button:hover {

            transform: translateY(-2px);

            border-color: var(--blue);

            box-shadow: var(--shadow);
        }


        .home-quick-title {

            color: var(--blue);

            font-size: 12px;

            font-weight: 700;
        }


        .home-quick-text {

            margin-top: 4px;

            color: var(--text-muted);

            font-size: 10px;
        }


        /* =========================================================
           RESULTS
        ========================================================= */

        .results-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 10px;
        }


        .results-title {

            font-size: 15px;

            font-weight: 800;
        }


        .status {

            color: var(--text-muted);

            font-size: 11px;
        }


        .result {

            background: var(--panel);

            border:
                1px solid var(--border);

            border-radius: 9px;

            padding: 16px;

            margin-bottom: 9px;

            transition: .15s;

            box-shadow:
                0 2px 8px rgba(0,0,0,.025);
        }


        .result:hover {

            background: var(--panel-hover);

            border-color: var(--blue);

            transform: translateY(-1px);
        }


        .result-title {

            font-size: 14px;

            font-weight: 800;

            color: var(--text);
        }


        .result-title-icon {
            color: var(--blue);
        }


        .result-category {

            margin-top: 5px;

            color: var(--text-muted);

            font-size: 10px;
        }


        .result-text {

            margin-top: 11px;

            padding: 11px;

            background: var(--input);

            border-left:
                3px solid var(--blue);

            border-radius:
                0 5px 5px 0;

            color: var(--text-secondary);

            font-size: 12px;

            line-height: 1.6;
        }


        .result-actions {

            display: flex;

            gap: 7px;

            margin-top: 12px;
        }


        .result button {

            border: none;

            border-radius: 6px;

            padding: 8px 12px;

            background: var(--blue);

            color: white;

            font-size: 11px;

            font-weight: 700;

            cursor: pointer;
        }


        .result button.secondary {

            background: var(--input);

            border:
                1px solid var(--border);

            color: var(--text-secondary);
        }


        .result button:hover {

            background: var(--blue-dark);
        }


        .result button.secondary:hover {

            color: var(--blue);

            border-color: var(--blue);

            background: var(--panel-hover);
        }


        mark {

            background:
                rgba(21,155,211,.22);

            color: var(--blue);

            border-radius: 2px;

            padding: 1px 2px;
        }


        /* =========================================================
           DOCUMENT
        ========================================================= */

        .document {

            display: none;

            background: var(--panel);

            border:
                1px solid var(--border);

            border-radius: 12px;

            overflow: hidden;

            box-shadow: var(--shadow);
        }


        .document-header {

            min-height: 58px;

            padding: 8px 14px;

            border-bottom:
                1px solid var(--border);

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;
        }


        .document-actions {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .back,
        .document-action {

            border:
                1px solid var(--border);

            background: var(--input);

            color: var(--text-secondary);

            padding: 8px 11px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 11px;
        }


        .back:hover,
        .document-action:hover {

            border-color: var(--blue);

            color: var(--blue);
        }


        .document-github {

            color: var(--blue);

            text-decoration: none;

            font-size: 11px;
        }


        .document-github:hover {
            text-decoration: underline;
        }


        /* =========================================================
           DOCUMENT LAYOUT
        ========================================================= */

        .document-body {

            display: grid;

            grid-template-columns:
                220px 1fr;
        }


        .document-toc {

            border-right:
                1px solid var(--border);

            padding: 20px 13px;

            position: sticky;

            top: 68px;

            height: calc(100vh - 68px);

            overflow-y: auto;
        }


        .toc-title {

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: .7px;

            color: var(--text-muted);

            font-weight: 800;

            margin-bottom: 10px;
        }


        .toc-item {

            display: block;

            padding: 6px 8px;

            margin-bottom: 2px;

            border-radius: 5px;

            color: var(--text-secondary);

            font-size: 10px;

            line-height: 1.4;

            cursor: pointer;
        }


        .toc-item:hover {

            background: var(--panel-hover);

            color: var(--blue);
        }


        .toc-h3 {
            padding-left: 17px;
        }


        .toc-h4 {
            padding-left: 27px;
        }


        .markdown {

            max-width: 950px;

            width: 100%;

            margin: auto;

            padding: 36px;

            color: var(--text-secondary);

            font-size: 14px;

            line-height: 1.75;
        }


        .markdown h1 {

            color: var(--text);

            font-size: 29px;

            padding-bottom: 11px;

            border-bottom:
                2px solid var(--blue);
        }


        .markdown h2 {

            margin-top: 38px;

            padding-bottom: 8px;

            border-bottom:
                1px solid var(--border);

            color: var(--text);

            font-size: 21px;
        }


        .markdown h3 {

            margin-top: 27px;

            color: var(--blue);

            font-size: 17px;
        }


        .markdown h4 {
            color: var(--text);
        }


        .markdown p {
            color: var(--text-secondary);
        }


        .markdown strong {
            color: var(--text);
        }


        .markdown a {
            color: var(--blue);
        }


        .markdown blockquote {

            margin: 16px 0;

            padding: 11px 15px;

            border-left:
                3px solid var(--blue);

            background: var(--input);

            color: var(--text-secondary);

            border-radius:
                0 6px 6px 0;
        }


        .markdown img {

            display: block;

            max-width: 100%;

            width: auto;

            height: auto;

            margin: 20px auto;

            border-radius: 7px;

            cursor: zoom-in;

            border:
                1px solid var(--border);

            background: var(--background);
        }


        .markdown table {

            width: 100%;

            border-collapse: collapse;

            margin: 18px 0;

            overflow: hidden;
        }


        .markdown th,
        .markdown td {

            border:
                1px solid var(--border);

            padding: 9px 11px;

            text-align: left;
        }


        .markdown th {

            background: var(--input);

            color: var(--text);
        }


        .markdown td {
            background: var(--panel);
        }


        .markdown code {

            background: var(--input);

            color: var(--blue);

            padding: 2px 5px;

            border-radius: 3px;
        }


        .markdown pre {

            background: #151719;

            border:
                1px solid var(--border);

            padding: 15px;

            border-radius: 7px;

            overflow-x: auto;
        }


        .markdown pre code {

            background: transparent;

            color: #ddd;

            padding: 0;
        }


        .markdown hr {

            border: none;

            border-top:
                1px solid var(--border);

            margin: 30px 0;
        }


        /* =========================================================
           EMPTY
        ========================================================= */

        .empty {

            background: var(--panel);

            border:
                1px solid var(--border);

            border-radius: 9px;

            padding: 45px 20px;

            text-align: center;

            color: var(--text-muted);

            font-size: 13px;
        }


        .empty-title {

            color: var(--text);

            font-weight: 800;
        }


        /* =========================================================
           LOADING
        ========================================================= */

        .loading-bar {

            position: fixed;

            left: 0;
            right: 0;
            top: 68px;

            height: 3px;

            z-index: 2000;

            display: none;

            overflow: hidden;

            background: var(--border);
        }


        .loading-bar.active {
            display: block;
        }


        .loading-progress {

            width: 30%;

            height: 100%;

            background: var(--blue);

            animation:
                loading 1s infinite ease-in-out;
        }


        @keyframes loading {

            from {
                transform: translateX(-120%);
            }

            to {
                transform: translateX(400%);
            }
        }

/* =========================================================

========================================================= */

const menuButton =
    document.getElementById("menuButton");

const sidebar =
    document.getElementById("sidebar");


/* =========================================================
   RECUPERAR ESTADO GUARDADO
========================================================= */

const sidebarOculta =
    localStorage.getItem("sidebar-hidden");


if (
    sidebarOculta === "true" &&
    window.innerWidth > 800
) {

    document.body.classList.add(
        "sidebar-hidden"
    );

}


/* =========================================================
   ACTUALIZAR BOTÓN
========================================================= */

function actualizarBotonSidebar() {

    const oculta =
        document.body.classList.contains(
            "sidebar-hidden"
        );


    menuButton.setAttribute(
        "aria-label",
        oculta
            ? "Mostrar barra lateral"
            : "Ocultar barra lateral"
    );


    menuButton.setAttribute(
        "title",
        oculta
            ? "Mostrar barra lateral"
            : "Ocultar barra lateral"
    );

}


/* =========================================================
   CLICK
========================================================= */

menuButton.addEventListener(
    "click",
    function () {

        /* DESKTOP */

        if (window.innerWidth > 800) {

            document.body.classList.toggle(
                "sidebar-hidden"
            );


            const oculta =
                document.body.classList.contains(
                    "sidebar-hidden"
                );


            localStorage.setItem(
                "sidebar-hidden",
                oculta
            );

        }

        /* MOBILE */

        else {

            sidebar.classList.toggle(
                "open"
            );

        }


        actualizarBotonSidebar();

    }
);


/* =========================================================
   INICIALIZAR
========================================================= */

actualizarBotonSidebar();


/* =========================================================
   CAMBIO DE TAMAÑO
========================================================= */

window.addEventListener(
    "resize",
    function () {

        if (window.innerWidth > 800) {

            sidebar.classList.remove(
                "open"
            );

        }

    }
);
